<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中西方美术史</title>
<meta name="description" content="画家关系图、名作时间轴与入门导读" />
<style>
/* ============ 设计令牌 ============ */
:root{
  --paper:#f6f5f2;
  --paper-2:#fffdfa;
  --paper-3:#efece5;
  --ink:#1d1d1f;
  --ink-2:#6e6e73;
  --ink-3:#94948f;
  --rule:rgba(29,29,31,.13);
  --rule-2:rgba(29,29,31,.07);
  --accent:#b42318;
  --accent-soft:rgba(180,35,24,.08);
  --china:#2f5c4c;
  --china-soft:rgba(47,92,76,.10);
  --west:#8a5433;
  --west-soft:rgba(138,84,51,.10);
  --shadow:0 1px 2px rgba(29,29,31,.05),0 8px 24px rgba(29,29,31,.06);
  --serif:Georgia,"Songti SC","STSong","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --num:Georgia,"Times New Roman",serif;
  --r:10px;
  --head-h:60px;
}
[data-theme="dark"]{
  --paper:#161615; --paper-2:#1e1e1c; --paper-3:#262624;
  --ink:#f0efe9; --ink-2:#a8a8a1; --ink-3:#7d7d76;
  --rule:rgba(240,239,233,.14); --rule-2:rgba(240,239,233,.07);
  --accent:#ff7469; --accent-soft:rgba(255,116,105,.12);
  --china:#7fbfa4; --china-soft:rgba(127,191,164,.14);
  --west:#d3a072; --west-soft:rgba(211,160,114,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:inherit}
::selection{background:var(--accent-soft)}
.sans{font-family:var(--sans)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* ============ 顶栏 ============ */
.top{
  height:var(--head-h); display:flex; align-items:center; gap:18px;
  padding:0 22px; border-bottom:1px solid var(--rule);
  background:var(--paper); position:relative; z-index:40;
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:17px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.brand .stamp{
  font-family:var(--sans); font-size:10px; letter-spacing:.12em;
  color:var(--ink-3); border:1px solid var(--rule); border-radius:4px;
  padding:1px 6px; white-space:nowrap;
}
.brand .trad{
  font-family:var(--sans); font-size:11px; color:var(--ink-2);
  border:1px solid var(--rule); border-radius:20px; padding:2px 9px; white-space:nowrap;
}
.brand .trad.china{color:var(--china);border-color:var(--china);background:var(--china-soft)}
.brand .trad.west{color:var(--west);border-color:var(--west);background:var(--west-soft)}

/* 视图切换 */
.views{display:flex;gap:2px;margin-left:auto;background:var(--paper-3);padding:3px;border-radius:8px}
.views button{
  border:0;background:transparent;border-radius:6px;padding:6px 13px;
  font-family:var(--sans);font-size:13px;color:var(--ink-2);letter-spacing:.02em;
  transition:background .18s ease,color .18s ease;
}
.views button:hover{color:var(--ink)}
.views button[aria-current="true"]{background:var(--paper-2);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* 搜索 */
.search{position:relative}
.search input{
  width:190px;height:34px;border:1px solid var(--rule);border-radius:7px;
  background:var(--paper-2);color:var(--ink);padding:0 30px 0 11px;
  font-family:var(--sans);font-size:13px;outline:none;transition:border-color .18s ease,width .2s ease;
}
.search input:focus{border-color:var(--ink-3);width:230px}
.search input::placeholder{color:var(--ink-3)}
.search .k{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font-family:var(--sans);font-size:10px;color:var(--ink-3);
  border:1px solid var(--rule);border-radius:3px;padding:0 4px;pointer-events:none;
}
.results{
  position:absolute;top:40px;right:0;width:340px;max-height:380px;overflow:auto;
  background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;
  box-shadow:var(--shadow);padding:5px;z-index:60;display:none;
}
.results.on{display:block}
.results .r{padding:7px 9px;border-radius:6px;cursor:pointer;display:flex;gap:9px;align-items:center}
.results .r:hover,.results .r.sel{background:var(--paper-3)}
.results .r .t{font-size:14px}
.results .r .m{font-family:var(--sans);font-size:11px;color:var(--ink-3);margin-left:auto}
.results .empty{padding:14px;font-size:13px;color:var(--ink-3);text-align:center}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dot.china{background:var(--china)} .dot.west{background:var(--west)}

/* ============ 布局 ============ */
.wrap{height:calc(100vh - var(--head-h));display:flex;flex-direction:column;overflow:hidden}
.view{flex:1;min-height:0;position:relative;display:none}
.view.on{display:flex;flex-direction:column}

/* --- 关系图 --- */
#v-graph .bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 22px;border-bottom:1px solid var(--rule-2);
  font-family:var(--sans);font-size:12px;color:var(--ink-2);
}
.chip{
  border:1px solid var(--rule);background:var(--paper-2);color:var(--ink-2);
  border-radius:20px;padding:4px 11px;font-size:12px;transition:.16s ease;
}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on.c{background:var(--china);border-color:var(--china);color:#fff}
.chip.on.w{background:var(--west);border-color:var(--west);color:#fff}
.bar .sep{width:1px;height:16px;background:var(--rule);margin:0 3px}
.bar .spacer{margin-left:auto}
.legend{display:flex;gap:12px;align-items:center;font-size:11.5px}
.legend i{display:inline-block;width:20px;height:0;border-top:2px solid var(--ink-3);margin-right:5px;vertical-align:middle}
.legend .i-lineage{border-top-style:solid}
.legend .i-influence{border-top-style:dashed}
.legend .i-rival{border-top-style:dotted}
.legend .i-milieu{border-top-style:solid;opacity:.35}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:
  radial-gradient(1200px 600px at 50% 30%, var(--paper-2), var(--paper) 70%)}
#graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#graph.grabbing{cursor:grabbing}
.node{cursor:pointer}
.node circle{transition:r .18s ease,opacity .18s ease}
.node text{
  font-family:var(--sans);font-size:11px;fill:var(--ink);
  paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round;
  pointer-events:none;
}
.edge{stroke:var(--ink-3);fill:none;stroke-linecap:round}
.edge.t-lineage{stroke-width:1.9;stroke-dasharray:none;opacity:.62}
.edge.t-influence{stroke-width:1.3;stroke-dasharray:5 4;opacity:.5}
.edge.t-rival{stroke-width:1.5;stroke-dasharray:1.5 3.5;opacity:.7;stroke:var(--accent)}
.edge.t-milieu{stroke-width:1.1;opacity:.24}
.dim{opacity:.09 !important}
.hi{opacity:.95 !important}
.axis text{font-family:var(--num);font-size:11px;fill:var(--ink-3)}
.axis line{stroke:var(--rule-2)}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px}
.zoom button{
  width:32px;height:32px;border:1px solid var(--rule);background:var(--paper-2);
  border-radius:7px;font-size:15px;line-height:1;color:var(--ink-2);
}
.zoom button:hover{color:var(--ink);border-color:var(--ink-3)}
.hint{
  position:absolute;left:18px;bottom:16px;font-family:var(--sans);font-size:11px;
  color:var(--ink-3);background:var(--paper-2);border:1px solid var(--rule);
  border-radius:7px;padding:5px 10px;
}

/* --- 详情抽屉 --- */
.drawer{
  position:absolute;top:0;right:0;width:min(430px,42vw);height:100%;
  background:var(--paper-2);border-left:1px solid var(--rule);
  box-shadow:var(--shadow);transform:translateX(102%);
  transition:transform .3s cubic-bezier(.22,.61,.36,1);
  display:flex;flex-direction:column;z-index:30;
}
.drawer.on{transform:none}
.dhead{padding:16px 20px 12px;border-bottom:1px solid var(--rule-2);display:flex;align-items:flex-start;gap:10px}
.dhead h3{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}
.dhead .sub{font-family:var(--sans);font-size:12px;color:var(--ink-2);margin-top:3px}
.dhead .x{margin-left:auto;border:1px solid var(--rule);background:transparent;border-radius:6px;width:28px;height:28px;line-height:1;color:var(--ink-2);flex:0 0 auto}
.dbody{flex:1;overflow:auto;padding:16px 20px 40px}
.dbody .tag{
  display:inline-block;font-family:var(--sans);font-size:12px;padding:3px 9px;border-radius:5px;
  background:var(--paper-3);color:var(--ink-2);margin-bottom:12px;
}
.dbody .tag.china{background:var(--china-soft);color:var(--china)}
.dbody .tag.west{background:var(--west-soft);color:var(--west)}
.dbody p{margin:0 0 14px;font-size:15px;line-height:1.85}
.fig{margin:4px 0 18px;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--paper-3)}
.fig .ph{position:relative;width:100%;padding-top:62%;overflow:hidden;background:var(--paper-3)}
.fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s ease}
.fig img.ok{opacity:1}
.fig .skel{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--sans);font-size:11px;color:var(--ink-3)}
.fig figcaption{
  font-family:var(--sans);font-size:11.5px;color:var(--ink-3);
  padding:7px 10px;border-top:1px solid var(--rule-2);display:flex;gap:8px;
}
.fig figcaption .cr{margin-left:auto;text-align:right;max-width:58%}
.rel{border-top:1px solid var(--rule-2);margin-top:6px;padding-top:12px}
.rel h4{margin:0 0 8px;font-size:13px;font-family:var(--sans);color:var(--ink-2);letter-spacing:.04em}
.rel .e{display:flex;gap:8px;align-items:baseline;padding:4px 0;font-size:14px}
.rel .e .k{font-family:var(--sans);font-size:10.5px;color:var(--ink-3);border:1px solid var(--rule);border-radius:3px;padding:0 4px;flex:0 0 auto}
.rel .e .who{cursor:pointer;border-bottom:1px solid transparent}
.rel .e .who:hover{border-bottom-color:var(--ink-3)}
.rel .e .lbl{font-family:var(--sans);font-size:11.5px;color:var(--ink-3);margin-left:auto;text-align:right}

/* --- 时间轴 --- */
#v-time .bar{padding:10px 22px;border-bottom:1px solid var(--rule-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--sans);font-size:12px;color:var(--ink-2)}
.tl{flex:1;overflow:auto;padding:26px 22px 80px;scroll-behavior:smooth}
.tl-era{
  display:grid;grid-template-columns:150px 1fr;gap:26px;
  padding:20px 0 34px;border-top:1px solid var(--rule);
}
.tl-era:first-child{border-top:0;padding-top:0}
.tl-era .eh{position:sticky;top:0;align-self:start}
.tl-era .eh .n{font-size:22px;letter-spacing:.04em}
.tl-era .eh .s{font-family:var(--num);font-size:12px;color:var(--ink-3);margin-top:2px}
.tl-era .eh .d{font-family:var(--sans);font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.65}
.tl-era .eh .side{
  display:inline-block;margin-top:9px;font-family:var(--sans);font-size:10.5px;
  padding:1px 7px;border-radius:4px;
}
.tl-era .eh .side.china{background:var(--china-soft);color:var(--china)}
.tl-era .eh .side.west{background:var(--west-soft);color:var(--west)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:18px}
.card{
  background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r);
  overflow:hidden;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--ink-3)}
.card .ph{position:relative;padding-top:68%;background:var(--paper-3);overflow:hidden}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s ease}
.card .ph img.ok{opacity:1}
.card .ph .skel{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--sans);font-size:10.5px;color:var(--ink-3);text-align:center;padding:8px}
.card .ph.bad{background:
  repeating-linear-gradient(135deg,var(--paper-3) 0 8px,var(--paper-2) 8px 16px)}
.card .meta{padding:10px 12px 13px}
.card .y{font-family:var(--num);font-size:11px;color:var(--ink-3)}
.card .t{font-size:15px;margin-top:1px;line-height:1.45}
.card .a{font-family:var(--sans);font-size:11.5px;color:var(--ink-2);margin-top:3px;display:flex;align-items:center;gap:5px}
.card .no{font-size:12.5px;color:var(--ink-2);margin-top:7px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* --- 对照时间轴 --- */
.cmp{flex:1;overflow:auto;padding:0 0 80px}
.cmp-head{
  display:grid;grid-template-columns:1fr 108px 1fr;gap:0;
  position:sticky;top:0;z-index:10;background:var(--paper);
  border-bottom:1px solid var(--rule);
}
.cmp-head div{padding:12px 20px;font-family:var(--sans);font-size:12.5px;letter-spacing:.06em}
.cmp-head .h-c{color:var(--china);border-bottom:2px solid var(--china);text-align:right}
.cmp-head .h-w{color:var(--west);border-bottom:2px solid var(--west)}
.cmp-head .h-m{text-align:center;color:var(--ink-3);display:grid;place-items:center}
.cen{display:grid;grid-template-columns:1fr 108px 1fr;border-bottom:1px solid var(--rule-2)}
.cen:hover{background:var(--paper-2)}
.cen .side{padding:14px 20px;display:flex;flex-direction:column;gap:8px}
.cen .side.c{align-items:flex-end;text-align:right}
.cen .mid{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border-left:1px solid var(--rule-2);border-right:1px solid var(--rule-2);
}
.cen .mid .c{font-family:var(--num);font-size:15px;color:var(--ink)}
.cen .mid .y{font-family:var(--sans);font-size:10.5px;color:var(--ink-3);text-align:center;line-height:1.35;padding:0 4px}
.pill{
  background:var(--paper-2);border:1px solid var(--rule);border-radius:8px;
  padding:7px 11px;cursor:pointer;max-width:100%;
  transition:transform .18s ease,border-color .18s ease;
}
.pill:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.pill .w{font-size:14px;line-height:1.4}
.pill .a{font-family:var(--sans);font-size:11px;color:var(--ink-2);margin-top:2px}
.pill .y2{font-family:var(--num);font-size:10.5px;color:var(--ink-3)}
.pill.c{border-left:3px solid var(--china)}
.pill.w{border-right:3px solid var(--west)}
.cen .none{font-family:var(--sans);font-size:11.5px;color:var(--ink-3);padding:4px 0}

/* --- 阅读室 --- */
#v-read .bar{padding:12px 22px;border-bottom:1px solid var(--rule-2);font-family:var(--sans);font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:10px}
.rd{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:0 0 90px}
.rd-inner{width:min(760px,92%);padding-top:34px}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
.big{font-size:38px;line-height:1.3;letter-spacing:.02em;margin:10px 0 12px;font-weight:600}
.lead{font-size:17px;color:var(--ink-2);line-height:1.85;margin:0 0 30px}
.essays{display:grid;gap:2px;border-top:1px solid var(--rule);margin-top:8px}
.ess{
  display:grid;grid-template-columns:56px 1fr 22px;gap:14px;align-items:baseline;
  padding:20px 4px;border-bottom:1px solid var(--rule-2);cursor:pointer;
  transition:background .18s ease;
}
.ess:hover{background:var(--paper-2)}
.ess .no{font-family:var(--num);font-size:20px;color:var(--ink-3)}
.ess .kk{font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);margin-top:2px}
.ess .ti{font-size:19px;line-height:1.5}
.ess .st{font-size:13.5px;color:var(--ink-2);margin-top:5px;line-height:1.7}
.ess .ar{color:var(--ink-3);font-size:16px}
.art{width:min(720px,92%);padding-top:30px}
.art .kicker{font-family:var(--sans);font-size:11px;letter-spacing:.18em;color:var(--accent)}
.art h1{font-size:31px;line-height:1.4;margin:10px 0 8px;font-weight:600}
.art .sf{font-size:16px;color:var(--ink-2);line-height:1.8;border-left:2px solid var(--rule);padding-left:14px;margin:0 0 26px}
.art h2{font-size:20px;margin:34px 0 10px;letter-spacing:.02em}
.art p{font-size:16.5px;line-height:1.95;margin:0 0 16px}
.art .srcs{margin-top:38px;padding-top:16px;border-top:1px solid var(--rule);font-family:var(--sans);font-size:12.5px;color:var(--ink-2);line-height:1.8}
.art .srcs b{font-size:12px;letter-spacing:.08em;color:var(--ink-3);display:block;margin-bottom:6px}
.art .cav{
  margin-top:14px;background:var(--paper-3);border-radius:8px;padding:12px 14px;
  font-size:13.5px;color:var(--ink-2);line-height:1.75;
}
.back{
  border:1px solid var(--rule);background:var(--paper-2);border-radius:7px;
  padding:6px 13px;font-family:var(--sans);font-size:12.5px;color:var(--ink-2);
}
.back:hover{color:var(--ink);border-color:var(--ink-3)}
.terms{margin-top:44px;padding-top:20px;border-top:1px solid var(--rule)}
.terms h3{font-size:17px;margin:0 0 14px}
.terms .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.terms .it{border:1px solid var(--rule-2);border-radius:8px;padding:11px 13px;background:var(--paper-2)}
.terms .it b{font-size:14.5px}
.terms .it .s{font-family:var(--sans);font-size:10px;color:var(--ink-3);margin-left:6px}
.terms .it .s.c{color:var(--china)} .terms .it .s.w{color:var(--west)}
.terms .it p{margin:5px 0 0;font-size:13px;color:var(--ink-2);line-height:1.7}

/* --- 每日一画 --- */
.daily{
  position:fixed;inset:0;background:rgba(20,20,19,.42);display:none;
  align-items:center;justify-content:center;z-index:80;padding:20px;
  backdrop-filter:blur(2px);
}
.daily.on{display:flex}
.dcard{
  width:min(520px,94vw);max-height:88vh;overflow:auto;background:var(--paper-2);
  border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.28);overflow-x:hidden;
}
.dcard .top2{display:flex;align-items:center;padding:14px 18px 8px}
.dcard .top2 .k{font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;color:var(--ink-3)}
.dcard .top2 button{margin-left:auto;border:0;background:transparent;font-size:20px;color:var(--ink-3);line-height:1}
.dcard .ph{position:relative;padding-top:56%;background:var(--paper-3);overflow:hidden}
.dcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s ease}
.dcard .ph img.ok{opacity:1}
.dcard .ph .skel{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--sans);font-size:11px;color:var(--ink-3)}
.dcard .bd{padding:16px 20px 22px}
.dcard h3{margin:0;font-size:22px;font-weight:600}
.dcard .who{font-family:var(--sans);font-size:12px;color:var(--ink-2);margin-top:4px}
.dcard p{font-size:15px;line-height:1.85;margin:12px 0 0}
.dcard .go{
  margin-top:16px;border:1px solid var(--rule);background:var(--paper);border-radius:7px;
  padding:7px 14px;font-family:var(--sans);font-size:12.5px;color:var(--ink-2);
}
.dcard .go:hover{color:var(--ink);border-color:var(--ink-3)}

/* 浮动按钮 */
.fab{
  position:fixed;right:20px;bottom:20px;z-index:50;
  border:1px solid var(--rule);background:var(--paper-2);border-radius:22px;
  padding:9px 16px;font-family:var(--sans);font-size:12.5px;color:var(--ink-2);
  box-shadow:var(--shadow);display:flex;align-items:center;gap:7px;
}
.fab:hover{color:var(--ink);border-color:var(--ink-3)}
.fab .dt{width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* 首屏 */
.gate{
  position:fixed;inset:0;z-index:90;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:30px;transition:opacity .5s ease;
}
.gate.off{opacity:0;pointer-events:none}
.gate .gl{font-size:13px;font-family:var(--sans);letter-spacing:.22em;color:var(--ink-3)}
.gate h1{font-size:clamp(30px,6vw,54px);margin:16px 0 10px;font-weight:600;letter-spacing:.04em}
.gate .gd{font-size:16px;color:var(--ink-2);max-width:520px;line-height:1.85;margin:0 0 30px}
.gate .gs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gate .gs button{
  border:1px solid var(--rule);background:var(--paper-2);border-radius:9px;
  padding:11px 20px;font-size:14px;transition:.2s ease;
}
.gate .gs button:hover{border-color:var(--ink);transform:translateY(-1px)}
.gate .gs button.p{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.gate .gn{margin-top:26px;font-family:var(--sans);font-size:11.5px;color:var(--ink-3)}

.empty-state{
  display:grid;place-items:center;height:100%;font-family:var(--sans);
  font-size:13px;color:var(--ink-3);
}

@media (max-width:1100px){
  .drawer{width:min(390px,72vw)}
}
@media (max-width:768px){
  :root{--head-h:52px}
  .top{padding:0 12px;gap:10px}
  .brand .trad,.brand .stamp{display:none}
  .views{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:0;
    border-top:1px solid var(--rule);background:var(--paper);padding:6px;justify-content:space-around;z-index:45}
  .views button{padding:7px 8px;font-size:12px}
  .search input{width:120px}
  .search input:focus{width:150px}
  .results{right:auto;left:0;width:min(340px,92vw)}
  .wrap{height:calc(100vh - var(--head-h) - 52px)}
  .drawer{width:100%;height:100%;border-left:0}
  .tl-era{grid-template-columns:1fr;gap:14px}
  .tl-era .eh{position:static}
  .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .cmp-head{grid-template-columns:1fr 74px 1fr}
  .cen{grid-template-columns:1fr 74px 1fr}
  .cen .side{padding:10px 12px}
  .cmp-head div{padding:10px 12px;font-size:11px}
  .big{font-size:29px}
  .art h1{font-size:25px}
  .fab{bottom:66px;right:12px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important;scroll-behavior:auto !important}
}
</style>
</head>

象征与装饰"},{"source":"gu_kaizhi","target":"yan_lib","type":"influence","label":"传神写正的延续"},{"source":"zhan_ziquian","target":"wang_ximeng","type":"influence","label":"青绿山水的源流"},{"source":"wu_daozi","target":"liang_kai","type":"influence","label":"笔势纵放的减笔画"},{"source":"wang_wei","target":"su_shi","type":"influence","label":"文人画的精神源头"},{"source":"jing_hao","target":"fan_kuan","type":"influence","label":"北方全景式大山"},{"source":"dong_yuan","target":"ju_ran","type":"lineage","label":"师承"},{"source":"li_cheng","target":"guo_xi","type":"influence","label":"李郭画派"},{"source":"dong_yuan","target":"huang_gongwang","type":"influence","label":"披麻皴与江南土山"},{"source":"ju_ran","target":"ni_zan","type":"influence","label":"平淡天真的一路"},{"source":"su_shi","target":"zhao_mengfu","type":"influence","label":"书画同源与士气"},{"source":"mi_fu","target":"zhao_mengfu","type":"influence","label":"古意与笔墨趣味"},{"source":"zhao_mengfu","target":"huang_gongwang","type":"lineage","label":"师承"},{"source":"fan_kuan","target":"li_tang","type":"influence","label":"北宋大山到南宋边角"},{"source":"li_tang","target":"ma_yuan","type":"lineage","label":"院体师承"},{"source":"li_tang","target":"xia_gui","type":"lineage","label":"院体师承"},{"source":"huang_gongwang","target":"shen_zhou","type":"influence","label":"元四家笔墨的明代回响"},{"source":"ni_zan","target":"shen_zhou","type":"influence","label":"疏淡构图的取法"},{"source":"shen_zhou","target":"wen_zhengming","type":"lineage","label":"师承"},{"source":"shen_zhou","target":"tang_yin","type":"milieu","label":"吴门四家"},{"source":"wen_zhengming","target":"qiu_ying","type":"milieu","label":"吴门四家"},{"source":"dong_qichang","target":"shi_tao","type":"rival","label":"正统与个性的张力"},{"source":"xu_wei","target":"bada_shanren","type":"influence","label":"大写意的孤独与激越"},{"source":"bada_shanren","target":"qi_baishi","type":"influence","label":"简笔与冷逸"},{"source":"shi_tao","target":"ren_bonian","type":"influence","label":"写意花鸟的海上传承"},{"source":"ren_bonian","target":"wu_changshuo","type":"milieu","label":"海上画派"},{"source":"wu_changshuo","target":"qi_baishi","type":"influence","label":"金石入画与衰年变法"},{"source":"xu_beihong","target":"qi_baishi","type":"milieu","label":"同一时代的不同选择"},{"source":"zhao_ji","target":"wang_ximeng","type":"lineage","label":"画学亲授"},{"source":"zhao_ji","target":"zhang_zeduan","type":"milieu","label":"翰林图画院"}],"essays":[{"id":"essay-01","no":"01","kicker":"TWO TIMELINES","title":"时间轴怎么读：为什么两条线不能简单对齐","standfirst":"中西方两列年份排在一起，很容易被当成同一场比赛的记分牌。这篇讲清楚三条线的起点、三个常被误对齐的年份，以及分期名目到底是谁定的。","minutes":6,"sections":[{"h":"两条线要回答的问题不同","p":["中国部分通常从商周青铜器讲起，西方部分从希腊瓶画和雕塑讲起。年代接近，性质不同。青铜鼎上的饕餮纹是礼器的一部分，纹样服务于祭祀，本来就不需要被「看懂」；黑绘瓶上的奔跑人像已经在讲故事，还用上了透视缩短。拿画得像不像去比，中国这一段必然显得落后，但这种比法从一开始就错位。中国早期美术要解决的是器物如何合乎礼制，西方要解决的是人体如何合乎比例。先认清对方在考什么，再谈成绩。"]},{"h":"三个常被误对齐的年份","p":["1450年前后，佛罗伦萨人在用布鲁内莱斯基的透视法安排画面，苏州的沈周在画《庐山高图》那样的密体山水。两者都是高峰，一个在争眼睛看到的空间，一个在争笔墨自身的秩序。约1000年，范宽把主峰堆到画面上方三分之二，同一时期欧洲还在画教堂壁画，人物按身份排大小，背景是一整片金色。1874年莫奈在巴黎展出《日出·印象》，同年是同治十三年，任伯年在上海卖扇面。同一年份并排放着，只说明两件事同时发生，不说明它们处在同一阶段。"]},{"h":"分期是后人划的","p":["巴洛克原本是贬义的「畸形」，印象派来自批评家对莫奈一幅画标题的讥讽，野兽派也是评论家给的名字。中国的南北宗是董其昌在十七世纪为立谱系造的框架，元四家、明四家的说法同样是后人的追认。分期让叙述有段落，也会骗人，让人以为某一年之后所有人同时换了画法。实际上一个新画法从出现到被接受，常常要一两代人。宋人不会自称在画院体，元人也不会自称在画文人画。"]},{"h":"怎么用这个站的两条轴","p":["建议先在一条轴上挑一个连续的五十年，看三四个画家怎么前后相接：谁跟谁学过，谁改了谁的笔法，谁靠谁付钱。再横着跳到另一条轴上同一年代，看那边在发生什么。差别比相似更容易记住。看到关系图里一条影响线，记得它是后人归纳的，不是当事人自己写的宣言；看到标了存疑的地方，就当作尚未定论，不必急着替学界裁决。还有一个笨办法更管用：记住三五个具体的年份、三五件作品的细节，比背十个流派的名字有用。"]}],"sources":["人物生卒年与作品系年取通行艺术史教材与博物馆著录，一般取整到年","分期名目与流派称谓的由来，参考通行西方艺术史叙述（如贡布里希《艺术的故事》相关章节）","南北宗说见董其昌《画禅室随笔》一系论述"],"caveat":"各条线的起止年份只为叙述方便，许多具体断代学界仍有分歧。"},{"id":"essay-02","no":"02","kicker":"READING LANDSCAPE","title":"中国山水画怎么看：皴法、留白与散点透视","standfirst":"山水画不靠像不像取胜，它的规则藏在笔法、空白和视点的安排里。这篇拆开三样东西：皴法怎么交代石头，留白怎么当实景用，长卷为什么可以一路换站位。","minutes":7,"sections":[{"h":"皴法：给石头和土坡找一种笔法","p":["看山水最先碰到的疑问是：那些像麻绳、像斧痕、像雨点的笔触是什么。它们是皴法，用来交代山石的质地和结构，不是装饰。董源画江南土山，用长条披麻皴，顺着坡势往下拖；范宽画关中石山，用密集的雨点状短皴反复积墨；李唐画峭壁，侧锋横刮，笔痕像斧刃切出的斜面，所以叫斧劈皴。看画时先认山形，再找笔法，两者是对应的。北方石山棱角分明，笔也硬；江南土坡圆缓，笔就长而软。同一幅画里常并用几种皴法，看主次就够了。"]},{"h":"留白不是没画完","p":["南宋的马远、夏圭把主体推到画面一角，其余地方不画任何东西。那不画的部分被读成水、雾、天。这不是省事：空白占得越大，留下的那块石头越显得孤。另一层原因是材料，绢和纸的底色本身就亮，空着不画，亮度高于任何白颜料。所以山水的空气感有一半是底子给的，不是画上去的。看《踏歌图》时可以留意，人物只占右下角一小块，上方是斧劈皴的峭壁，中间的空处让视线能停下来。宋人画水也靠空，只在水纹转折处添几根细线。"]},{"h":"散点透视：一张画里换几次站位","p":["西方线性透视固定一个视点，中国长卷反过来。郭熙在《林泉高致》里提出高远、深远、平远，说的是三种看山的位置：仰看山势高，俯看山势深，平看山势远。一幅画里可以轮换，《早春图》前面平看，中景俯看，主峰仰看。长卷更彻底，《千里江山图》长近十二米，视线跟着水走，没有哪一处是唯一正确的观看位置。代价是局部看会不准：屋宇与山的比例、远近的层次，都不合几何透视。看长卷的方式也不同，不是站定看，是边走边展开，一段一段读。"]},{"h":"可行可望可游可居","p":["郭熙这八个字常被拿来解释山水的观看方式：好山水要让人愿意走进去、看得远、待得住。这个标准不问像不像，问的是能不能住人。所以山水里总有路、桥、亭和几个很小的人。看画时可以专门找这几样：一条从画面外引进来的路，一座架在水上的桥，一个空着的亭子。它们是画家标出的入口。找不到入口的画，通常也不是给人游的。这八个字出自《林泉高致》，原话在讲取景，不是一条抽象评画标准。"]}],"sources":["三远说见郭熙、郭思《林泉高致》","皴法名目自《芥子园画传》以来的画谱系统逐步定型，宋人未必自称披麻皴","作品年代与尺寸取故宫博物院、台北故宫博物院等馆方著录"],"caveat":"皴法分类是明清人整理出来的，不宜当作宋人的自我描述。"},{"id":"essay-03","no":"03","kicker":"PERSPECTIVE AND ANATOMY","title":"为什么死磕透视与解剖：从乔托到文艺复兴的技术动机","standfirst":"透视和解剖不是为了科学，是为了让画里的故事可信：让观众相信那间屋子能走进去，那个人真的能抬手。这套技术是被具体问题一步步逼出来的，后来又被拆掉。","minutes":7,"sections":[{"h":"乔托先解决了重量","p":["乔托的《哀悼基督》里没有透视网格，但他做了一件前人不做的事：人物有体积，衣褶顺着身体垂下来，所有人朝同一个焦点看。这已经是一种空间安排，只是靠经验而不是靠计算。他死后不久黑死病席卷欧洲，画坛重新回到金底与正面律。所以文艺复兴的技术不是顺理成章的进步，中间断过一次，这一点常被叙述抹平，看起来像一条平滑上升的线。乔托之后紧接的是锡耶纳画派，更偏装饰，与佛罗伦萨的路子并不同。"]},{"h":"透视：把眼睛的位置写成规则","p":["布鲁内莱斯基在十五世纪初用一面镜子和一幅画做过演示，证明平面上的透视可以按几何构造。阿尔伯蒂1435年的《论绘画》把它写成规则：先定地平线，再定一个消失点，让垂直于画面的平行线向这一点收拢。效果很直接：一间屋子里的地砖、梁木、人的身高，都可以按同一套比例缩放，画面第一次有了可以测量的深度。马萨乔、乌切洛接着在壁画上试，到拉斐尔画《雅典学院》，地面的网格几乎可以直接量出来。这套规则假设观看者站着不动、只睁一只眼。"]},{"h":"解剖：让动作合乎骨头","p":["中世纪壁画里的人体多半被衣袍包住，不需要交代关节。文艺复兴把衣服减掉，问题就来了：抬手时肩胛怎么动，转身时腰在哪里折。达·芬奇解剖过多具尸体，留下大量肌肉与骨骼图；米开朗基罗没有留下系统的解剖笔记，但西斯廷天顶上那些扭转的人体，每一处都落在骨点上。这不是炫技，是为了让观众相信这些人真的能做出那些动作。解剖图在十六世纪开始印刷，维萨里的图版把它变成了公开教材。"]},{"h":"技术到位之后，反而开始拆它","p":["十六世纪之后，这套技术成了学院的基本功，也成了束缚。安格尔把人体拉长，德拉克洛瓦让笔触留在画布上，两人的争论持续了半辈子。到塞尚，多个视点被并置在同一幅画里，透视的单一性被放弃。印象派之后，画得像不再是主要问题。回头看，透视与解剖在四百年里是工具，不是目的：它们被造出来是为了让故事可信，故事不需要了，工具也就松了。学院把技法定成必修时，也把题材一起定了下来。"]}],"sources":["阿尔伯蒂《论绘画》1435年拉丁文本，透视构造的规则表述以此为主要依据","达·芬奇解剖手稿分藏温莎堡与米兰等地，数量以整理本为准","画家生卒与作品年代取通行著录"],"caveat":"布鲁内莱斯基的镜子演示只见于后人记述，具体做法仍有讨论。"},{"id":"essay-04","no":"04","kicker":"WHAT IMPRESSIONISM DID","title":"印象派革命了什么：不只是画得模糊","standfirst":"印象派常被说成画得模糊，那是结果不是原因。真正变化的是三件事：画在哪里画、颜色怎么调、一张画画到什么程度算完。还有一件常被搞混的：他们并不是一个统一行动的团体。","minutes":6,"sections":[{"h":"先有材料，才可能外光","p":["十九世纪中期，锡管装颜料普及，画家不必在画室里研磨颜料，可以背出去。便携画架、折叠凳也在此时出现。更要紧的是新颜料：铬黄、钴蓝、合成群青陆续上市，颜色比传统矿物颜料更亮，也更便宜。有了这些，一张画可以在两三个小时里完成，光线变了就换一张。外光画从练习变成了方法，不是态度先变，是条件先到。在这之前，户外只是画习作的地方，完成品必须回画室做。颜料商还配套卖便携画箱，一箱能装十几支。"]},{"h":"颜色不再在调色板上混完","p":["学院的方法是先画褐色底稿，再一层层罩染透明色，暗部靠罩染加深。印象派把这套流程反过来：不铺底稿，直接用不透明的浅色在画布上摆笔，颜色并置，让眼睛在观看距离上自己去混。红与绿并排，退远看成了灰，但比调出来的灰更亮。画面整体明度因此提高，暗部变少，也解释了为什么近看是一堆笔触。代价是形体边缘必须放弃，所以看上去糊。新印象派把这条路推到极端，代价是画面变僵硬。"]},{"h":"题材和完成度一起被重新定义","p":["他们画的多数不是神话和历史，是巴黎近郊的河岸、火车站、舞会、床上的女人。这类画在当时连未完成都算不上。1874年第一次展览被讥为印象派，名字就来自莫奈《日出·印象》的标题。争议的核心不是技巧，是标准：一张画要画到什么程度才算画完。印象派给出的答案是，光的效果抓住了就算完。为了留住湿润，他们用厚涂和快笔，一幅画当天做完，隔天再画另一个时刻。自办展览也让他们不必等沙龙点头。"]},{"h":"被误读的部分","p":["有一点常被搞混：印象派不是一个纲领明确的团体。莫奈和雷诺阿并肩在户外画，德加几乎不外出，更在意构图与取景，塞尚后来嫌他们缺结构。马奈从未参加他们的展览，却被当作中心。他们共享的只有一件事：拒绝沙龙那套送审与制作的流程。至于画什么、画到什么程度，各人答案不同。共同的敌人一走，分歧立刻露出来，这也解释了为什么印象派之后马上分裂。"]}],"sources":["1874年第一届展览与印象派得名的经过，见当时评论与展览目录","颜料史部分参考通行的十九世纪绘画材料研究","画家人名与作品年代取通行著录"],"caveat":"印象派成员之间的差异常被叙述抹平，此处只取大体共同点。"},{"id":"essay-05","no":"05","kicker":"LITERATI AND SHIQI","title":"文人画与士气：三个人重写了评价标准","standfirst":"十一世纪到十七世纪，中国画的评价标准被改写过两次半。改写的人不是画工，是官员、收藏家和理论家。这篇看苏轼、赵孟頫、董其昌各动了哪一块，以及这套标准排除了谁。","minutes":7,"sections":[{"h":"苏轼：把形似降级","p":["苏轼留下的一句话常被引用：论画以形似，见与儿童邻。意思是只按像不像评画，见识跟小孩差不多。他推的是士人画，讲究常理与意气，不讲究工细。他自己画墨竹、枯木、怪石，笔迹粗率。这套说法在当时不是主流，画院仍是主力；但它提供了一把新尺子，让不工的人也有了辩护词。南宋以后，这把尺子越用越顺手，最终成了文人画自我论证的起点。他身边有李公麟、米芾这些人，实践让理论有了落脚处。"]},{"h":"赵孟頫：把书法接进来","p":["赵孟頫的贡献是技术上的。他主张作画贵有古意，力追唐与北宋，明确反对南宋院体那一套。更要紧的是他提出以书入画：画竹用写撇的笔，画石用飞白，枝干用篆书的中锋。这样，一幅画的水平可以借用书法的标准衡量，而书法是文人日常都在练的东西。书画同源从此不只是说法，成了可操作的做法。元代以后，几乎无人绕开这条路径。他自己的画并不粗率，《鹊华秋色图》青绿很薄，笔迹清楚，说明古意不等于草率。"]},{"h":"董其昌：把谱系定下来","p":["董其昌做的是编谱系。他借禅宗分南北宗，把王维到元四家列为南宗正脉，把李思训到马远、夏圭一路列为北宗，尊南贬北。这套分法在史实上站不稳：马远、夏圭的笔墨并不比谁低，王维也没有可靠真迹。但它极其有效，清代三百年正统画坛基本按这个谱系排座次。看画史时要记得，谱系是被造出来的，造它有当下的用意。他本人的画也照这套来：学黄公望，学倪瓒，构图越画越简，笔越用越干。"]},{"h":"士气这个词的实际含义","p":["士气不是清高。它指的是一幅画里要能看出读书人的笔意与判断：用笔不能描，构图不能满，题跋要能自己写。这几条把画工排除在外，因为画工没有这套训练。代价是题材变窄，人物画在文人手里衰落，山水与墨竹成了主项，工细一路被贬为匠气。另一个代价是门槛被换掉了：不再比谁画得像，改比谁的笔迹经得起看，评判权也就落到了同代人手里。只谈意境不谈笔法，就把最关键的部分漏掉了。"]}],"sources":["苏轼论画语见其题画诗文，具体表述各本略有出入","赵孟頫古意说与以书入画的主张，见其题跋及后世画论引述","南北宗说见董其昌《画禅室随笔》"],"caveat":"南北宗的史实依据一直受质疑，本篇只讲它如何被使用。"},{"id":"essay-06","no":"06","kicker":"FROM LIKENESS TO STATUS","title":"现代艺术为什么看不懂：从塞尚到杜尚","standfirst":"看不懂通常不是因为画得差，是因为问题换了。以前问这张画画得像不像，后来问它凭什么算艺术。这篇按时间排几个转折点，并在最后给出三个可以先问的问题。","minutes":8,"sections":[{"h":"塞尚：先怀疑视觉的可靠性","p":["塞尚画圣维克多山画了几十次。他不满意印象派的地方是结构：光一变颜色就变，画面留不住东西。他的办法是把自然还原成几何体块，用平行的短笔触一块块并置，靠色块之间的接缝暗示转折。更麻烦的是视点：一幅画里同时有几个观察位置，桌沿的两端不在同一条线上。这在当时看着像画错了，实际是主动放弃单点透视。他想要的不是瞬间，是能留下来的秩序。他晚年说过要用圆柱、球体、圆锥来处理自然，这句话后来被反复引用。"]},{"h":"立体主义与抽象：拆完还剩什么","p":["毕加索与布拉克把这套做法推到极端。1907年《亚维农的少女》里，右侧面孔的鼻子与眼睛画在同一个侧面上，来源是伊比利亚雕塑和非洲面具。此后画面被切成小块，物体的几个面同时摊开。康定斯基再往前一步：既然形可以脱离对象，颜色也可以，于是取消物象。蒙德里安把剩下的东西压到直线、直角和三原色。抽象不是画不出来，是主动减去。抽象的理由各家不同，共同的是一场减法。"]},{"h":"杜尚：把问题从画布上挪走","p":["1917年，杜尚以 R. Mutt 的名义把一只工业小便池送进纽约独立艺术家协会的展览。作品被倒过来摆，签名随手写在侧边。他要争的是一件具体的事：谁有权决定什么是艺术。如果评委可以拒收，那么艺术就不是物品的属性，而是机构与语境给的。此后他几乎不画画，去下棋。观念艺术、装置、行为，都从这个问题上长出来。他选小便池不是随手：这东西没有任何审美伪装，逼人只看选择本身。"]},{"h":"看不懂时可以先问三件事","p":["面对一件现代作品，先问：它要解决什么问题？这个问题是上一代人留下的吗？它用什么手段解决，这个手段有效吗？这三问不保证你会喜欢，但能让你做出判断，而不是只能说看不懂。需要说明的是，现代的看不懂有一部分确实是失败：观念讲得不清楚，手法也撑不住，评论替它补了太多话。承认这一点不丢人，也不等于否定整个二十世纪。另外要留意年代，二十世纪后半段有一半在回应前半段，跳过顺序就看不懂它在反驳谁。"]}],"sources":["杜尚《泉》1917年送展经过，见当时协会记录与后人整理","画家人名、作品年代与收藏地取通行著录","对现代艺术的批评性意见参考通行的二十世纪艺术史叙述"],"caveat":"现代作品的价值判断分歧极大，本篇只提供提问方式，不替读者下结论。"}],"daily":[{"id":"daily_1","workId":"fan_kuan","title":"一座山占满三分之二画面","text":"《溪山行旅图》的主峰几乎顶到画幅上缘，瀑布只是一条直下的白线，山脚的驴队和行旅小得像几个墨点。范宽用密集的雨点皴一层层积墨，凑近看全是短促的点。他要的不是可游的风景，是一种压过来的体量。"},{"id":"daily_2","workId":"monet","title":"画的是港口的一次日出","text":"《日出·印象》画勒阿弗尔港的清晨。太阳是一点橙红，天和水都是灰蓝，倒影只是几笔短横。没有轮廓，吊车和船桅都成了灰影。1874年展出时，批评家抓住这个标题讽刺整个群体，名字就这样留下来了。"},{"id":"daily_3","workId":"huang_gongwang","title":"干笔擦出来的富春江","text":"《富春山居图》用干笔淡墨，笔锋几乎擦着纸走，靠反复叠加出厚。长卷没有戏剧性的高潮，同一段江岸反复变化。清初收藏者临终想烧它殉葬，被抢出时已断成两段，今分藏浙江省博物馆与台北故宫。"},{"id":"daily_4","workId":"vermeer","title":"一颗珍珠只要两笔白","text":"《戴珍珠耳环的少女》里那颗珍珠只用两点白：一点高光，一点反光，其余留暗。少女的脸转向观众，身体还朝着左边，嘴唇微开。维米尔的光总从左侧窗户进来，蓝色用的是天然群青，当时比黄金还贵。"},{"id":"daily_5","workId":"wang_ximeng","title":"十八岁，十二米，满幅青绿","text":"《千里江山图》长近十二米，王希孟画它时约十八岁，得宋徽宗亲授。石青石绿一层层罩在赭石底上，至今没怎么褪。长卷的山势跟着水走，每隔一段安排一个村落或桥，节奏靠这个推。"},{"id":"daily_6","workId":"duchamp","title":"一个尿斗改写了什么问题","text":"1917年，杜尚以 R. Mutt 的名义把一只工业小便池送进纽约独立艺术家协会的展览。作品被倒过来摆，签名随手写在侧边。争论很快不再是画得好不好，而是谁有权决定一件东西算不算艺术。他此后几乎不画画了。"},{"id":"daily_7","workId":"bada_shanren","title":"鸟翻白眼，纸大半空着","text":"八大山人的鱼鸟常画成方眼、眼珠朝上，被后人读作翻白眼。更该看的是位置：一只鸟站在石头上，其余大片空纸不补任何东西。他的署款「八大山人」四字连写，看起来像「哭之笑之」。"},{"id":"daily_8","workId":"van_eyck","title":"凸镜里多出两个人","text":"《阿尔诺菲尼夫妇像》中央挂着一面凸镜，镜里映出两个进门的人，其中一个可能就是画家本人。镜框上写着一行拉丁文，大意是凡·艾克在此。左侧窗光落在铜吊灯、木地板和狗身上，每种材质的反光都不同。"},{"id":"daily_9","workId":"picasso","title":"一张脸上有三个角度","text":"《亚维农的少女》右侧两张脸的鼻子和眼睛画在同一个侧面上，来源是伊比利亚雕塑和非洲面具。背景的布帘被切成几何块，透视深度被取消。1907年画成时，连他的朋友都觉得太过。立体主义从这里开始。"},{"id":"daily_10","workId":"liang_kai","title":"几笔一个人","text":"《泼墨仙人图》里衣服是一大团浓墨，五官只用细线勾几道，腰带用一笔横过去。整个人往前倾，像走不稳，笑得很含糊。梁楷做过画院待诏，赐金带不受，挂在院里就走了。减笔这条路，后世接的人不多。"},{"id":"daily_11","workId":"guo_xi","title":"一张画里有三种看法","text":"《早春图》把高远、深远、平远挤在同一幅里：近处平看，中景俯看，主峰仰看。石头轮廓像云头翻卷，人称卷云皴。郭熙在画院受神宗重用，儿子整理的《林泉高致》记下他的说法：山水要可行、可望、可游、可居。"},{"id":"daily_12","workId":"warhol","title":"三十二个罐头排成一行","text":"1962年，沃霍尔把金宝汤罐头用丝网印成三十二个并排，数量正好对应当时市面上的汤品种类。印的痕迹规整，边角有轻微错位，不追求手绘感。同一年他开始印玛丽莲·梦露的头像，重复、褪色、错版都保留下来。"}],"terms":[{"term":"皴法","def":"用笔表现山石肌理的技法总称。披麻皴画江南土山，斧劈皴画北方石山，雨点皴靠密集短点积墨。名目多为后人所定。","tradition":"china"},{"term":"留白","def":"不画的部分被当实景用：空白可以是水、是雾、是天。南宋马远、夏圭把大片空白留在画面一侧，构图重心因此偏出中心。","tradition":"china"},{"term":"散点透视","def":"不固定单一视点，让视线沿长卷移动。北宋山水常把仰视、俯视、平视拼在一幅里，郭熙称为高远、深远、平远。","tradition":"china"},{"term":"书画同源","def":"把书法用笔带进绘画：中锋、侧锋、飞白、转折都成了画枝干和画石轮廓的手段。赵孟頫主张以书入画，元代以后成常规。","tradition":"china"},{"term":"南北宗","def":"董其昌借禅宗分宗重排画史：王维至元四家为南宗，李思训至马远、夏圭为北宗，尊南贬北。影响清三百年，也一直有争议。","tradition":"china"},{"term":"士气","def":"文人画的价值标准，指画中要有读书人的笔意与判断，不靠精细取胜。苏轼说论画以形似，见与儿童邻，常被引来解释这一点。","tradition":"china"},{"term":"界画","def":"用界尺画建筑、舟桥的画法，要求梁柱、门窗、地砖合乎结构比例。张择端《清明上河图》的虹桥是标本，清代宫廷建筑图属此列。","tradition":"china"},{"term":"青绿山水","def":"以石青、石绿为主色的山水，赭石打底，颜色层层罩染。展子虔、王希孟是一路；大青绿浓重，小青绿薄而透。","tradition":"china"},{"term":"没骨","def":"不勾轮廓，直接以色或墨块塑形。传自五代徐熙一系，清代恽寿平的花卉常用，任伯年的人物衣袍也用此法。","tradition":"china"},{"term":"减笔","def":"用尽量少的笔画出人物或花鸟，靠留白与笔势补足。南宋梁楷是代表，写意人物一路多受此法影响。","tradition":"china"},{"term":"院体画","def":"宫廷画院供养的绘画，讲法度、重写实，题材偏花鸟与山水。北宋徽宗朝画院最盛，南宋李唐、马远、夏圭一系延续。","tradition":"china"},{"term":"大写意","def":"以放逸的笔势、湿润的墨色作花卉，形似退居其次。徐渭开其端，八大山人、吴昌硕、齐白石各推一段。","tradition":"china"},{"term":"线性透视","def":"在平面上定地平线与消失点，让平行线向同一点收拢。布鲁内莱斯基十五世纪初做过演示，阿尔伯蒂1435年《论绘画》写成规则。","tradition":"west"},{"term":"晕涂法","def":"把明暗过渡揉到看不出边界的画法，达·芬奇最常用。《蒙娜丽莎》的眼角与嘴角没有硬线，边界化在暗部里。","tradition":"west"},{"term":"明暗对照","def":"用强对比的光与暗塑造体积和戏剧性。卡拉瓦乔把光源压成一道斜光，背景几乎全黑，这种极端做法后来被称为暗绘。","tradition":"west"},{"term":"罩染","def":"在已干的色层上薄薄罩一层透明色，让下层透上来。北方油画靠这个做出深度与光泽，凡·艾克是代表。","tradition":"west"},{"term":"厚涂","def":"颜料堆得厚，笔痕凸出画面，能看到作画的动作。伦勃朗晚年的脸、梵高的天空都用厚涂。","tradition":"west"},{"term":"外光","def":"在户外直接对着景物画，不用画室里的光。管装颜料与便携画架普及后成为可能，印象派把它从练习变成方法。","tradition":"west"},{"term":"补色","def":"色轮上相对的两色，如红与绿。并置而不混合，让眼睛自己去调，画面因此更亮。印象派与新印象派都靠这一条。","tradition":"west"},{"term":"色点","def":"把纯色小点密集并置，靠视觉混合产生颜色。修拉《大碗岛的星期天下午》是标本，理论取自谢弗勒尔与鲁德。","tradition":"west"},{"term":"平面化","def":"主动放弃纵深与体积，把画面压回二维。高更的平涂、马蒂斯的色块、毕加索的几何切面都在这条线上。","tradition":"west"},{"term":"现成品","def":"把工业制品挑出来、签名、送进展览，宣称它是艺术。杜尚1917年的《泉》是起点，作品的内容变成选择这个动作。","tradition":"west"},{"term":"学院派","def":"官方美术学院确立的标准：历史画地位最高，素描优先，题材取古典。十九世纪法国沙龙是关口，印象派正是被这个体系挡在门外。","tradition":"west"},{"term":"崇高","def":"十八世纪的美学概念：面对巨大、危险、超出把握的自然时的恐惧与快感。透纳的暴风雨、弗里德里希的雾海常被归入此类。","tradition":"west"}],"images":{"giotto":{"file":"assets/works/giotto.jpg","commonsFile":"File:Giotto - Scrovegni - -36- - Lamentation (The Mourning of Christ) adj.jpg","commonsPage":"https://commons.wikimedia.org/wiki/File:Giotto_-_Scrovegni_-_-36-_-_Lamentation_%28The_Mourning_of_Christ%29_adj.jpg","license":"Public domain","credit":"W pages_from_%27Landscapes_and_Calligraphy%27_by_Dong_Qichang_II.jpg?width=900"},"shi_tao":{"file":"assets/works/shi_tao.jpg","commonsFile":"File:Norway, The Hardanger Fiord (NBY 440683).jpg","commonsPage":"https://commons.wikimedia.org/wiki/File:Norway%2C_The_Hardanger_Fiord_%28NBY_440683%29.jpg","license":"Public domain","credit":"https://collections.carli.illinois.edu/cdm/compoundobject/collection/nby_teich/id/440684","objectName":"Norway, The Hardanger Fiord (NBY 440683)","w":900,"h":591,"partial":false,"remote":"https://commons.wikimedia.org/wiki/Special:FilePath/Norway%2C_The_Hardanger_Fiord_%28NBY_440683%29.jpg?width=900"},"ren_bonian":{"file":"assets/works/ren_bonian.jpg","commonsFile":"File:'Lotus', gold ink on paper by Ren Bonian, Honolulu Museum of Art.JPG","commonsPage":"https://commons.wikimedia.org/wiki/File:%27Lotus%27%2C_gold_ink_on_paper_by_Ren_Bonian%2C_Honolulu_Museum_of_Art.JPG","license":"CC0","credit":"Own work","objectName":"'Lotus', gold ink on paper by Ren Bonian, Honolulu Museum of Art","w":900,"h":317,"partial":false,"remote":"https://commons.wikimedia.org/wiki/Special:FilePath/%27Lotus%27%2C_gold_ink_on_paper_by_Ren_Bonian%2C_Honolulu_Museum_of_Art.JPG?width=900"},"wu_changshuo":{"file":"assets/works/wu_changshuo.jpg","commonsFile":"File:Record of the life of Wu Changshuo.jpg","commonsPage":"https://commons.wikimedia.org/wiki/File:Record_of_the_life_of_Wu_Changshuo.jpg","license":"CC BY-SA 4.0","credit":"Own work","objectName":"Record of the life of Wu Changshuo","w":900,"h":675,"partial":false,"remote":"https://commons.wikimedia.org/wiki/Special:FilePath/Record_of_the_life_of_Wu_Changshuo.jpg?width=900"},"qi_baishi":{"file":"assets/works/qi_baishi.jpg","commonsFile":"File:Qi Baishi crater EN0217986716M.jpg","commonsPage":"https://commons.wikimedia.org/wiki/File:Qi_Baishi_crater_EN0217986716M.jpg","license":"Public domain","credit":"PILOT, Planetary Image Locator Tool, USGS Astrogeology Science Center","objectName":"Qi Baishi crater EN0217986716M","w":900,"h":896,"partial":false,"remote":"https://commons.wikimedia.org/wiki/Special:FilePath/Qi_Baishi_crater_EN0217986716M.jpg?width=900"}},"copy":{"nodes":{"gu_kaizhi":{"tagline":"把传神写进画论的人物画家","bio":"东晋人，画人物可以数年不点眼睛，说传神写照正在阿堵中。原作不存，今见《洛神赋图》为宋摹本：线条细匀如春蚕吐丝，山石画得比人大，正是早期山水的比例观念。"},"zhan_ziquian":{"tagline":"青绿山水现存最早的样本","bio":"隋代画家，历北齐、北周而入隋。《游春图》常被举为现存最早的独立山水卷轴，但它的年代与真伪学界一直有不同意见。画中人与山的比例仍不协调，山石已用青绿重色。"},"yan_lib":{"tagline":"把朝堂接见画成纪实","bio":"唐初宫廷画家，官至宰相。《步辇图》画唐太宗坐步辇接见吐蕃使者禄东赞，人物按身份排大小，不靠表情叙事。现存为宋摹本，是唐初人物画的常见标本。"},"wu_daozi":{"tagline":"吴带当风，壁画今无一存","bio":"盛唐画师，主要在寺观画壁，据说一生画壁三百余堵。后世称其衣纹飘举为吴带当风，与北齐曹仲达的曹衣出水相对。传世《送子天王图》为宋人摹本，只能间接看他的笔势。"},"wang_wei":{"tagline":"水墨山水的名义源头","bio":"唐代诗人，官至尚书右丞，晚年居辋川。苏轼评他诗中有画、画中有诗。后世把水墨渲淡一路追到他名下，但他没有可靠的真迹存世，《辋川图》只有传摹与石刻。"},"jing_hao":{"tagline":"太行山里立起北方山水","bio":"唐末五代人，隐居太行山洪谷，自号洪谷子。传为他的《笔法记》提出气、韵、思、景、笔、墨六要。画风是全景式的大山堂堂，用短促的钉头皴交代石质。"},"dong_yuan":{"tagline":"披麻皴，专画江南土山","bio":"南唐画家，一说曾任后苑副使。画江南平缓的丘陵，用长条披麻皴顺着坡势拖，山上点密集的墨点当树。元代以后被追认为南宗山水的祖师之一，《潇湘图》是常用标本。"},"ju_ran":{"tagline":"把江南山水带进北宋京城","bio":"南唐亡后入宋，在开封开宝寺画壁画。承董源一路，山形更圆浑，山顶多作矾头，即一堆堆叠起来的石块，山体用长披麻皴。与董源并称董巨，是元以后文人山水的共同源头。"},"li_cheng":{"tagline":"寒林平远，惜墨如金","bio":"五代宋初人，唐朝宗室后裔，居山东营丘。画寒林平远之景，枝干像蟹爪一样向下弯再上翘，用墨极淡，人称惜墨如金。与关仝、范宽并称北宋三大家，可靠真迹极罕。"},"fan_kuan":{"tagline":"雨点皴堆出一座压人的山","bio":"陕西华原人，长期居终南山、太华山一带。用密集的雨点状短皴反复积墨，山顶好作密林，水边画大石。《溪山行旅图》主峰占去大半画面，行旅只有几个点，体量感由此而来。"},"guo_xi":{"tagline":"把三远法写进画论的人","bio":"北宋画院艺学，神宗朝最受重用的山水画家。其子整理的《林泉高致》记下他的说法：高远、深远、平远。画石轮廓翻卷如云头，人称卷云皴，墨色滋润。《早春图》作于1072年。"},"zhang_zeduan":{"tagline":"五米长卷里的北宋汴京","bio":"北宋画院画家，生平记载极少，籍贯与生卒都不确定。《清明上河图》画汴河两岸从郊野到城门的景象，画中人逾八百，船二十余艘，建筑与舟桥用界画法，结构可逐一核对。"},"zhao_ji":{"tagline":"皇帝画家，也是画院赞助人","bio":"北宋末代皇帝，在位时扩充翰林图画院，以画学取士。本人工花鸟，《瑞鹤图》画宣德门上空二十只丹顶鹤，天空用石青平涂不画云。旧说其画以生漆点睛，此事存疑。后为金人俘虏。"},"wang_ximeng":{"tagline":"十八岁一张画，青绿到顶","bio":"北宋画院学生，得徽宗亲授。《千里江山图》长近十二米，作于1113年，他时年约十八。石青石绿一层层罩在赭石底上，至今颜色鲜明。此后他再没有可靠作品记录。"},"li_tang":{"tagline":"从北宋大山到南宋边角","bio":"河阳人，徽宗朝已入画院，靖康之变后南渡临安，晚年授成忠郎。画石用侧锋横刮，笔痕像斧刃切出的斜面，故称斧劈皴。《万壑松风图》作于1124年，仍是北宋式的满构图。"},"ma_yuan":{"tagline":"马一角：把山水推到画边","bio":"南宋光宗、宁宗朝画院待诏，出身绘画世家。构图多取一角半边，人称马一角，留大片空白当水天。笔法劲利，松枝瘦硬如屈铁。与夏圭并称马夏，是南宋院体的代表。"},"xia_gui":{"tagline":"半边山水，墨比马远更湿","bio":"南宋宁宗朝画院待诏，略晚于马远。构图同样偏重一侧，但用墨更湿，善用秃笔和拖泥带水皴，墨色层次更丰富。《溪山清远图》长卷可见他的节奏，不靠单点的高潮。"},"su_shi":{"tagline":"论画以形似，见与儿童邻","bio":"北宋文人，官至礼部尚书，一生多次被贬。提出士人画与画工画的区分，重意气与常理而不重形似。画墨竹、枯木、怪石，传世《枯木怪石图》的真伪学界仍有讨论。"},"mi_fu":{"tagline":"米点：用横墨点堆出云山","bio":"北宋书画家、鉴藏家，曾任书画学博士，举止狂放，好着唐服。画山水不用硬线勾轮廓，用横卧的墨点层层叠加表现云山烟雨，人称米点山水。可靠真迹几无存，多为后人仿作。"},"liang_kai":{"tagline":"减笔：几笔一个人","bio":"南宋宁宗朝画院待诏，赐金带不受，挂在院内就离开了。工笔与写意都能，后期用减笔，寥寥数笔立出人物。《泼墨仙人图》衣袍是一大团浓墨，五官只勾几道细线。"},"zhao_mengfu":{"tagline":"书画同源，把字法带进画里","bio":"宋宗室后裔，出仕元朝，官至翰林学士承旨。主张作画贵有古意，力追唐与北宋，反对南宋院体。画石用飞白，画竹如写撇。《鹊华秋色图》画济南的鹊山与华不注，两山形态对照。"},"huang_gongwang":{"tagline":"干笔淡墨，画富春江数年","bio":"常熟人，曾为小吏，中年入全真道，号大痴。师赵孟頫，取法董巨。《富春山居图》用干笔长披麻皴，墨色层层积染。清初藏家临终想烧它殉葬，抢出时已断为两段，今分藏两处。"},"ni_zan":{"tagline":"一河两岸，干净到极简","bio":"无锡人，家富，中年散尽家财泛舟太湖。构图多是近处疏树空亭、中间大片空白当水、远山淡墨一抹。干笔侧锋，几乎不渲染，自题逸笔草草，不求形似，聊以自娱。"},"shen_zhou":{"tagline":"吴门画派的开启者","bio":"苏州人，一生不仕，家贫而交游极广，卖画养母。《庐山高图》作于1467年，为老师陈宽祝寿，用王蒙式的解索皴画密体山水，山即是人。粗笔细笔兼能，用笔厚重。"},"wen_zhengming":{"tagline":"细笔青绿，苏州文人的标准像","bio":"沈周弟子，科举九试不第，五十四岁才入翰林，三年后辞归苏州。画风细谨，设色清雅，八九十岁仍在作画，代笔与赝作也因此不少。《真赏斋图》作于1549年，时年八十。"},"tang_yin":{"tagline":"才子叙事背后是个落第举人","bio":"苏州人，二十九岁乡试第一，次年会试卷入科场舞弊案被黜，此后卖画为生。山水兼学南北两路，人物仕女尤清丽。《秋风纨扇图》用白描淡墨画女子执扇独立，题诗自况。"},"qiu_ying":{"tagline":"漆工出身的工笔重彩高手","bio":"出身漆工，后随周臣学画，长期在收藏家项元汴家临摹古画，见过大量宋元真迹。工笔重彩与青绿山水皆精，界画准确。《汉宫春晓图》长卷画宫廷女子日常，人物百余，色彩浓丽。"},"dong_qichang":{"tagline":"南北宗论：给画史重排家谱","bio":"松江人，官至南京礼部尚书，是大收藏家也是理论家。借禅宗南北分宗比附画史，尊王维至元四家为南宗正脉，贬马夏一路为北宗。此说影响清三百年，也一直被后人质疑。"},"xu_wei":{"tagline":"把墨泼在纸上，也泼进自己","bio":"绍兴人，八次乡试不中，入胡宗宪幕府，胡下狱后精神失常，数次自杀未死，又因杀妻入狱七年。晚年潦倒卖画。大写意花鸟用胶墨，笔势狂放，《墨葡萄图》题笔底明珠无处卖。"},"bada_shanren":{"tagline":"哭之笑之，鱼鸟都翻白眼","bio":"南昌人，明宗室后裔，十九岁遇明亡，一度为僧为道。署款八大山人四字连写，形似哭之笑之。画鱼鸟多作方眼、眼珠朝上，构图极简，署名与印章的位置也讲究。"},"shi_tao":{"tagline":"笔墨当随时代，出自他","bio":"广西人，明宗室后裔，出家为僧，晚年定居扬州卖画。著《苦瓜和尚画语录》，主张一画与搜尽奇峰打草稿，反对一味临摹。山水构图奇险，苔点密集压在淡墨山体上。"},"ren_bonian":{"tagline":"上海卖画市场里的全能画师","bio":"绍兴人，后居上海，以人物、花鸟、肖像为业，是海上画派最卖座的画家之一。兼工带写，色彩明快，衣袍常用没骨法直接铺色，脸则细画。《酸寒尉像》画的是吴昌硕。"},"wu_changshuo":{"tagline":"金石入画，写意花鸟变厚重","bio":"安吉人，曾任安东县令一月即辞，后定居上海。精篆刻与石鼓文，五十岁后学画，把碑版的厚重笔法带进大写意花卉，设色浓艳。曾任西泠印社首任社长，弟子众多。"},"qi_baishi":{"tagline":"从木匠到衰年变法","bio":"湘潭人，早年做雕花木匠，二十七岁才正式从师学画。五十七岁定居北京，听从陈师曾的建议衰年变法，走红花墨叶一路。题材多虾、蟹、蛙、菜蔬，题款直白，不装斯文。"},"xu_beihong":{"tagline":"用素描改造中国画教学","bio":"宜兴人，1919年赴法留学，入巴黎国立高等美术学校。回国后长期主持中央大学艺术系与北平艺专，主张以西方素描的造型能力改造中国画人物。画马用浓墨大笔，鬃尾作飞白。"},"giotto":{"tagline":"第一个让画中人有了重量","bio":"佛罗伦萨人，据十六世纪瓦萨里追述曾受奇马布埃指点，此说可靠度有限。斯克罗威尼礼拜堂的《哀悼基督》里人物有体积，衣褶垂坠，天空是整片深蓝，众人朝同一处看。"},"van_eyck":{"tagline":"透明罩染，细节到毫厘","bio":"尼德兰画家，曾任勃艮第公爵宫廷画师。《阿尔诺菲尼夫妇像》里凸镜映出两个进门的人，铜吊灯上还点着蜡烛。他并非发明油画，但把油性媒介的透明罩染推到了当时的极限。"},"botticelli":{"tagline":"线条比解剖更要紧的佛罗伦萨人","bio":"佛罗伦萨画家，受美第奇家族庇护。《维纳斯的诞生》画在布上，身体比例并不严格准确，靠轮廓线的韵律取胜。晚年受萨伏那洛拉影响转向宗教题材，据说烧过自己的作品。"},"leonardo":{"tagline":"晕涂法：让轮廓消失在暗处","bio":"芬奇镇人，学徒于韦罗基奥作坊，完成的绘画不到二十件，笔记却留下七千余页。用晕涂法把边缘揉虚，《蒙娜丽莎》的眼角与嘴角因此没有硬边。解剖图与飞行器草图同在手稿里。"},"michelangelo":{"tagline":"把人当建筑来画","bio":"卡普雷塞人，自称雕塑家而非画家。1508至1512年独自完成西斯廷礼拜堂天顶，《创造亚当》的两只手将触未触，中间的空隙是全画的中心。他为壁画设计了大量夸张扭转的人体。"},"raphael":{"tagline":"把两位大师合成一个公式","bio":"乌尔比诺人，父亲是画家。《雅典学院》让柏拉图和亚里士多德站在中央，一个指天一个指地，把达·芬奇与米开朗基罗也画了进去。三十七岁去世，作品成了后世学院派的标准。"},"titian":{"tagline":"威尼斯的光，靠色不靠线","bio":"威尼斯画派的核心人物，一生在威尼斯工作，客户包括查理五世与腓力二世。不用线条起稿，直接以颜料塑形，晚年笔触粗放。《乌尔比诺的维纳斯》把神话题材搬进了当时的室内。"},"durer":{"tagline":"北方人的版画与比例研究","bio":"纽伦堡人，金银匠家庭出身，两次去意大利，把透视与人体比例的理论带回北方。铜版画细到可数清线条，也写过测量与比例的书。1500年那张正面自画像用了基督式的定型构图。"},"bruegel":{"tagline":"把圣经挪进佛兰德的雪地","bio":"生卒与出生地记载都模糊，一般认为生于布拉班特。画农民、村庄、季节，也画圣经题材，但人物总淹没在风景里。《雪中猎人》属一套月令图，画深冬狩猎归来的下坡路。"},"caravaggio":{"tagline":"把光斜切进暗处","bio":"米兰近郊人，到罗马后靠静物与风俗画进入市场。《圣马太的召唤》里基督的手指向税桌，一束斜光从右上切入，把人物分成明暗两半。他有杀人官司，流亡途中病死，年三十八。"},"rubens":{"tagline":"大画幅、活肌肉、兼做外交","bio":"生于德国，成长于安特卫普，在意大利研究提香与卡拉瓦乔八年。回国后开大作坊，学生与助手众多，同时为多国王室作画兼办外交。《劫夺留基波斯的女儿们》用旋转的对角线组织人与马。"},"rembrandt":{"tagline":"一生画自己，从得意到破产","bio":"莱顿人，二十多岁在阿姆斯特丹成名，画群像、圣经题材，也留下大量自画像。《夜巡》画的本是白天场景，因清漆变暗而得名。后半生破产，家产被拍卖，用厚颜料堆出人物的脸。"},"vermeer":{"tagline":"代尔夫特的室内，光从左边来","bio":"代尔夫特人，一生没离开这座城市，存世作品仅三十余件，多为小幅室内。光总从左侧窗户进来，蓝色用天然群青。生前不富裕，死后债务缠身，被遗忘两百年，十九世纪才重新被发现。"},"poussin":{"tagline":"先有构图，再有情感","bio":"诺曼底人，三十岁后定居罗马。用舞台式的前景、中景、远景分层组织画面，人物姿态取自古代雕塑。《阿卡迪亚的牧人》里几个人围着一座墓碑，碑上写着我也曾在阿卡迪亚。"},"watteau":{"tagline":"画贵族散场那一刻","bio":"瓦朗谢讷人，到巴黎后以画游乐图成名。《舟发西苔岛》1717年提交皇家学院，学院为此专设一个新类别。人物衣着华丽而神情疏离，像正准备离开。他三十七岁死于肺病。"},"david":{"tagline":"把罗马共和国搬给法国革命用","bio":"巴黎人，罗马学成后以历史画确立地位。大革命期间任国民公会代表，投票赞成处死路易十六，也为罗伯斯庇尔画过像。《马拉之死》把遇刺的政客画成浴缸里的殉道者，背景一片空白。"},"ingres":{"tagline":"线条至上，为此可改解剖","bio":"蒙托邦人，大卫的学生，1806至1824年长住罗马。坚持线条优先与古典题材，与德拉克洛瓦长期对立。《泉》画了三十年才完成，右臂的比例并不合解剖，但轮廓干净到底。"},"delacroix":{"tagline":"色彩先行，笔触不许擦平","bio":"巴黎人，与安格尔是隔代的对立面。仰慕鲁本斯与威尼斯画派，用互补色并置，笔触有意保留。《自由引导人民》把寓言人物放在真实街垒上，画的是1830年七月革命，他在场。"},"turner":{"tagline":"光和雾比物体更要紧","bio":"伦敦人，父亲是理发师。早年画地形水彩，后来把形体消解在雾与光里。《被拖去解体的战舰无畏号》画一艘老军舰被拖向拆船厂，落日压在画面中央。他留下约两万张纸上作品。"},"friedrich":{"tagline":"背影对着观众，风景就有了心情","bio":"生于波美拉尼亚，在哥本哈根学画，后定居德累斯顿。常用背面人物让人望向远方，《雾海上的旅人》即是。风景在他这里不是背景，而是信仰与孤独的载体，海天常压得很低。"},"courbet":{"tagline":"把普通人的葬礼画成历史画","bio":"奥尔南人，1840年代到巴黎。1855年自办现实主义展览并发表宣言。《奥尔南的葬礼》高三米余，画的是家乡一场普通葬礼，当时被斥为丑陋。后因参与巴黎公社流亡瑞士，客死异乡。"},"millet":{"tagline":"巴比松：画劳动者弯腰的时刻","bio":"诺曼底农家出身，1849年定居巴比松村。画播种、拾穗、晚祷，人物身形厚重，地平线压得低。《拾穗者》里三个农妇占满前景，背景堆着麦垛，政治解读在当年就已出现。"},"manet":{"tagline":"把古典构图借来再拆掉","bio":"巴黎中产家庭出身，父亲希望他学法律。1863年《草地上的午餐》被沙龙拒绝，在落选者沙龙展出，争议来自题材与平光。他始终未参加印象派展览，却被那批人当作中心。"},"monet":{"tagline":"同一景物，不同时刻画几十遍","bio":"巴黎人，童年在勒阿弗尔。1872年《日出·印象》被批评家讥为印象，名字落到整个群体头上。1883年定居吉维尼，挖池塘种睡莲反复画。晚年白内障，颜色转向浑浊的红与黄。"},"renoir":{"tagline":"光斑落在人脸和裙子上","bio":"利摩日人，少年在瓷器厂画花。与莫奈并肩在户外作画，《煎饼磨坊的舞会》把阳光穿过树叶的斑块画在人脸和背上。晚年类风湿严重，把画笔绑在手上继续画，作品转向暖色。"},"degas":{"tagline":"画舞者的疲惫，不画优雅","bio":"巴黎人，家境富裕，早年临摹安格尔与意大利古典画。不满足于外光，更在意构图，常把人物切在画框边缘，像照片的偶然取景。他画舞者上台前弯腰揉脚、打哈欠的样子。"},"cezanne":{"tagline":"把自然还原成圆柱、球、锥","bio":"艾克斯人，与左拉是少年朋友，后因左拉小说中的画家形象而绝交。认为印象派缺结构，用色块并置与多个视点画圣维克多山。晚年几乎只画那座山与浴者，一只苹果要画上百笔。"},"vangogh":{"tagline":"厚涂的笔触在画布上打转","bio":"荷兰人，做过画商、教师、传教士，二十七岁才决定画画。1886年到巴黎，受印象派与日本浮世绘影响，颜色转亮。1889年在圣雷米疗养院画《星月夜》，天空笔触成漩涡状。"},"gauguin":{"tagline":"平涂的色块，问人从哪来","bio":"巴黎人，做过水手与股票经纪人，三十五岁才全职画画。1891年去塔希提，用平涂色块与粗黑轮廓，不要明暗过渡。《我们从何处来》画于女儿去世后，他说画完想过自杀。"},"seurat":{"tagline":"用色点做光学实验","bio":"巴黎人，学院派出身，读谢弗勒尔与鲁德的色彩理论。《大碗岛的星期天下午》用无数小色点铺满，历时两年，1886年在独立艺术家沙龙展出。三十一岁死于传染病，作品不多。"},"klimt":{"tagline":"金子贴出来的维也纳","bio":"维也纳人，父亲是金银雕刻匠，早年画剧院壁画。维也纳分离派首任主席。在画上贴金箔，《吻》里两个人裹在一张装饰性的金色斗篷中，只有脸与手是写实的肤色。"},"munch":{"tagline":"把声音画成波纹","bio":"挪威人，母亲与姐姐先后死于结核。1893年《呐喊》有多个版本，画的是桥上一个人，天空是横向的橘红波纹。他说那声音是四周传来的巨大无限。他后来活了八十岁，作品转向更明亮的色。"},"matisse":{"tagline":"颜色本身就能安排画面","bio":"法国北部人，早年学法律，二十一岁才开始画画。1905年野兽派得名于评论家说他的画如同野兽。《舞蹈》只用三种色：橙红的人体、蓝绿的地与更深的天，五个人手拉手围成一圈。"},"picasso":{"tagline":"把一张脸画成三个角度","bio":"马拉加人，父亲是美术教师。1907年《亚维农的少女》里右侧面孔取法伊比利亚雕塑与非洲面具，正面与侧面并置。此后与布拉克一起做立体主义，一生风格多次断裂式转变。"},"kandinsky":{"tagline":"取消物象，让颜色直接说话","bio":"莫斯科人，三十岁辞去法学教职去慕尼黑学画。1911年与马尔克组织青骑士。著《论艺术中的精神》，认为颜色与形状可以直接对应情绪。后在包豪斯任教，晚年转入几何语汇。"},"mondrian":{"tagline":"直线、直角与三原色","bio":"荷兰人，早年画风车与树，1912年到巴黎后逐步抽象。用水平与垂直的直线、三原色加黑白灰，追求他认为的普遍秩序。1940年移居纽约，晚年的《百老汇爵士乐》出现许多小色块。"},"duchamp":{"tagline":"一个尿斗签上名送进展厅","bio":"法国人，兄姐都是艺术家。1917年以 R. Mutt 的名义把工业小便池送进纽约独立艺术家协会展览。此后几乎放弃画画，下棋、做《大玻璃》。他把谁有权决定什么是艺术变成了作品内容。"},"dali":{"tagline":"把梦境画得像照片一样清楚","bio":"加泰罗尼亚人，在马德里学画时与布努埃尔、洛尔迦交往。自称偏执狂批判法，把妄想画得如同摄影。《记忆的永恒》里三只怀表软塌在枯枝、桌沿和一张怪脸似的形体上。"},"pollock":{"tagline":"画布铺地，滴、倒、甩","bio":"生于怀俄明，成长于亚利桑那与加州，1930年代到纽约。1947年起做滴画：画布铺地，用棍子把颜料滴甩上去，人在画中走动。他说自己就在画里。《秋韵（第30号）》没有中心也没有上下。"},"warhol":{"tagline":"把罐头和明星印成一排","bio":"匹兹堡的斯洛伐克移民家庭出身，先做商业插画。1962年用丝网印把金宝汤罐头画成三十二个并排，同年开始做玛丽莲·梦露的重复头像。1964年成立工厂，把工作室做成流水线。"}},"works":{"gu_kaizhi":{"note":"看衣带：细匀如春蚕吐丝，粗细几乎不变。看比例：树石画得比人小，山水还没找到自己的尺度。"},"zhan_ziquian":{"note":"看青绿：赭石打底，石青石绿罩上。看比例：骑马的人比远山还大。看水岸：坡脚细线勾，空白直接当水。"},"yan_lib":{"note":"看大小：太宗最大，使者次之，随从最小，身份靠尺度说明。看姿态：使者前倾拱手，太宗静止不动。"},"wu_daozi":{"note":"看衣纹：线条有粗细提按，起笔重收笔轻，一波三折，即后人说的吴带当风。摹本里还能看出这个节奏。"},"wang_wei":{"note":"看它怎么被复制：原迹早失，现存石刻与摹本，读的是后人理解的王维。山石线勾轮廓后淡墨渲染。"},"jing_hao":{"note":"看主峰：几乎占满中轴，山脚压着小路与人家。看笔：短促的钉头皴一点点敲在石面上，交代石的硬。"},"dong_yuan":{"note":"看山形：平缓圆丘，没有险峰。看笔：披麻皴顺坡势下拖，山上墨点当树。看水面：大片留白，人只占一角。"},"ju_ran":{"note":"看山顶：石块堆成矾头，像叠起的卵石。看左下：草屋两间，两人对坐，全画尺度由这两个小人定住。"},"li_cheng":{"note":"看树：枝干像蟹爪，先下弯再上翘。看墨：极淡，靠几层叠加才有分量。碑在前景，人在碑下显得很小。"},"fan_kuan":{"note":"看比例：主峰顶到画缘，瀑布一条直下，行旅只是几个点。看笔：雨点状短皴反复积墨，近看全是墨点。"},"guo_xi":{"note":"看三种视角同框：近景平视，中景俯视，主峰仰视。看石：轮廓翻卷如云头，人称卷云皴，墨色湿润。"},"zhang_zeduan":{"note":"看虹桥：木拱每根梁都能数出来，是界画的功夫。看细节：船过桥洞要把桅杆放倒，画里正在放。"},"zhao_ji":{"note":"看构图：二十只鹤绕殿顶盘旋，天空用石青平涂，一点云也不画。看姿态：几乎没有两只重复，被当作写生证据。"},"wang_ximeng":{"note":"看青绿：石青石绿层层罩在赭石底上，今天仍鲜。看水纹：细线勾成网纹，是当时画水的通行做法。"},"li_tang":{"note":"看石：侧锋横刮，笔痕像斧刃切出的斜面。看松：枝干占满前景，松针的倾侧指出风的方向。"},"ma_yuan":{"note":"看留白：大片空白被读成天空与雾。看人物：四个老人在田埂踏歌，画在右下角，重心偏得明显。"},"xia_gui":{"note":"看墨色：浓淡几层湿墨拖出雾，层次比马远丰富。看长卷：没有突出高潮，节奏靠景物疏密一路推。"},"su_shi":{"note":"看笔：枯树枝干一笔旋转画成，石头用飞白擦出孔洞。看位置：树石挤在左侧，右侧几乎空着，字来补。"},"mi_fu":{"note":"看墨点：横卧的墨点一层压一层，堆出湿润的山与树。看轮廓：几乎没有硬线，雾处直接空着不勾不染。"},"liang_kai":{"note":"看对比：衣服是一团浓墨，五官只用细线勾几道。看姿态：人往前倾，像走不稳，笑得很含糊。"},"zhao_mengfu":{"note":"看两座山：华不注尖，鹊山平，同卷对照。看笔：山用披麻皴带飞白，树用篆书式的圆笔写出来。"},"huang_gongwang":{"note":"看干笔：笔锋几乎擦着纸走，墨极淡，靠反复叠加出厚。看长卷：同一段江岸反复变化，没有高潮。"},"ni_zan":{"note":"看构图：近处疏树空亭，中间整片空白当水，远山淡墨一抹。看笔：干笔侧锋，几乎不渲染，只略点苔。"},"shen_zhou":{"note":"看皴法：解索皴一笔接一笔，把山体填满。看用意：这是给老师祝寿的画，山即是人，题记里写明。"},"wen_zhengming":{"note":"看细笔：梁枋、栏杆、书册都画得可数，人物只有两个。看设色：青绿很薄，压在淡墨上，不抢线条。"},"tang_yin":{"note":"看题诗：四句写秋扇被弃，画中女子执扇独立。看衣纹：白描细线，衣带被风吹向一侧，脸却平静。"},"qiu_ying":{"note":"看密度：一段窗、一张榻、一盆花都交代清楚，人物百余。看界画：廊柱、地砖、帘钩都合规矩。"},"dong_qichang":{"note":"看笔墨的自足：山石树木成了书法式的组合，形似退到后面。看题跋：一景一题，字与画排在同一平面。"},"xu_wei":{"note":"看墨的湿度：葡萄用饱水的墨点点成，叶片用大笔侧锋按出，边缘渗开。看枝：一笔长线贯穿到底。"},"bada_shanren":{"note":"看空白：一只鸟站石上，其余大片空纸。看眼神：眼画成方框，眼珠朝上。看落款连写，形似哭之笑之。"},"shi_tao":{"note":"看构图：山从纸角倒插进来，路径断断续续。看苔点：浓墨点密密压在淡墨山体上，是他的记号。"},"ren_bonian":{"note":"看写照：吴昌硕穿官服站得拘谨，脸却老实。看技法：衣袍用没骨大块铺色，不勾线，脸则细画。"},"wu_changshuo":{"note":"看笔：枝干用篆书中锋，一笔一笔像在刻印。看色：洋红直接泼在纸上，浓得发亮，与墨叶对照。"},"qi_baishi":{"note":"看怎么画声音：画里没有一只蛙，只有几只蝌蚪顺溪水游下。看墨：几笔浓墨点蝌蚪，水全靠留白。"},"xu_beihong":{"note":"看结构：头、颈、腿按解剖画，骨骼看得出。看墨：颈背用浓墨大笔扫出，鬃尾作飞白，蹄下不画地。"},"giotto":{"note":"看视线：所有人的目光与身体都朝向基督的脸。看岩石：一条斜线从右上切下，把整群人往低处压。"},"van_eyck":{"note":"看凸镜：镜里映出两个进门的人，其中一个可能是画家。看光：窗光落在铜吊灯、地板和狗身上。"},"botticelli":{"note":"看轮廓：身体边缘有明确一条线，解剖并不准确。看衣纹：风神吹风、侍女举衣，画面靠飘动连起来。"},"leonardo":{"note":"看晕涂：眼角与嘴角没有硬边，边界化在暗部里。看背景：两侧地平线不等高，左侧更低。看手：指节放松。"},"michelangelo":{"note":"看两只手：食指将触未触，中间留一点空隙，力量全在这里。看亚当：手指无力，头略侧，刚从土里被唤起。"},"raphael":{"note":"看手势：柏拉图指天，亚里士多德掌心向下。看地面：透视网格可以量出来，人物按距离递减缩小。"},"titian":{"note":"看目光：维纳斯直视观众，与睡着的维纳斯不同。看背景：两个仆人翻箱子的动作把画面拉回日常。"},"durer":{"note":"看姿态：完全正面，右手抬起，借用了基督的定型图像。看细节：金色长发一根根画出，皮草领子的毛可数。"},"bruegel":{"note":"看视线：猎人背对观众下坡，引向远处的山谷与村庄。看细节：结冰的池塘、滑冰的人同属一刻。"},"caravaggio":{"note":"看光：一束斜光从右上进来，正好落在马太脸上。看手势：基督的手指向税桌，几与亚当的手同型。"},"rubens":{"note":"看结构：两个女子与两个男人的身体连成一条上升的斜线，马在下方托住。看肉色：粉白衬着深褐与金黄。"},"rembrandt":{"note":"看光：班长与副官在最亮处，其余人从暗里出来。看细节：女孩腰上挂着一只鸡爪，是队伍的徽记。"},"vermeer":{"note":"看珍珠：只有两笔白，一点高光一点反光，其余留暗。看转身：脸转向观众，身体仍朝左，嘴唇微开。"},"poussin":{"note":"看墓碑：几个人围着读碑上的拉丁文，我也曾在阿卡迪亚。看构图：人物排成水平横带，情绪不外露。"},"watteau":{"note":"看方向：所有人朝右侧的船走，脚步却是慢的。看颜色：粉金与橄榄绿。看右侧：雕像标出这地方属于维纳斯。"},"david":{"note":"看空白：上半张画完全是空的墙，只有一个人和一个木箱。看木箱：上面写着献给马拉，大卫，手里还捏着纸。"},"ingres":{"note":"看轮廓：身体边缘一线到底，没有多余转折。看右臂：被拉长，肩肘关节不自然。看水罐：水斜下成直线。"},"delacroix":{"note":"看结构：金字塔式，自由女神在顶点，脚边是尸体。看颜色：三色旗的红蓝白最响，其余是灰褐烟尘。"},"turner":{"note":"看太阳：落日压在画面正中，船在右侧，桅杆细得像骨架。看水面：拖船与军舰的倒影混在薄雾里。"},"friedrich":{"note":"看背影：人站在岩石上背对我们，看不到表情。看雾：岩峰越远越淡，深度全靠明度差，拐杖撑得并不轻松。"},"courbet":{"note":"看尺寸：三米多高，与历史画一样大，画的却是一群乡民。看构图：人群横排，没有主角也没有高潮。"},"millet":{"note":"看动作：三个女人弯腰，只有一个半直起身。看远处：麦垛堆得像小山，骑马的人在看着她们。"},"manet":{"note":"看光：几乎没有中间调，人物像被闪光灯照亮，立体感被压平。看视线：裸女直视观众，两个男人在谈别的。"},"monet":{"note":"看颜色：太阳是一点橙红，天与水都是灰蓝，倒影只是几笔短横。看笔触：没有轮廓，船桅只是灰影。"},"renoir":{"note":"看光斑：树叶影子落在人脸和背上，成了紫蓝色的斑。看构图：长椅斜穿画面，人被切在边缘。"},"degas":{"note":"看构图：地面占了近一半，老师在中间，舞者靠墙散开。看动作：有人在揉背，有人在拉袜子，只有一个在跳。"},"cezanne":{"note":"看色块：山体被分解成平行笔触，没有连续轮廓。看视点：不同部分并不统一，像从几个位置拼起来。"},"vangogh":{"note":"看笔触：天空是一圈圈同方向的短笔触，成漩涡。看柏树：像火苗窜到画顶，把天与地连起来。"},"gauguin":{"note":"看平面：几乎没有明暗，颜色是平涂的块。看结构：从右到左是出生、生活、老去，神像站在最左边。"},"seurat":{"note":"看色点：整幅由小点铺成，近看是一层颗粒。看人物：姿态僵硬如剪影，多数朝同一方向看，几乎不互动。"},"klimt":{"note":"看金箔：两个人合成一块金色斗篷，上面满是几何纹样。看脸与手：只有这三处是写实肤色，其余全装饰。"},"munch":{"note":"看波纹：天空是横向的橘红，向两侧扩散，像声音的形状。看桥：栏杆一条斜线插进画面，把空间劈开。"},"matisse":{"note":"看颜色：只有橙红的人体、蓝绿的地与更深的天三种。看构图：五个人围成环，中间那个没拉到，环是断的。"},"picasso":{"note":"看右侧两张脸：鼻与眼画在同一个侧面上，借自非洲面具。看空间：布帘被切成几何块，透视深度消失。"},"kandinsky":{"note":"看形状：圆、三角、直线互相穿插，没有一个物体可辨认。看重量：大圆压在左上，小元素散在右下。"},"mondrian":{"note":"看线：黑线粗细一致，只有水平与垂直，没有对角线。看格：红块最大，黄与蓝很小，位置决定轻重。"},"duchamp":{"note":"看签名：器皿侧边写着 R. Mutt 与年份，位置随手。看角度：作品被倒过来摆，出水口朝上，底座已弃。"},"dali":{"note":"看三只表：一只挂枯枝，一只搭桌沿，一只盖在怪脸上，都能弯。看蚂蚁：表盘上爬满蚂蚁，是腐烂的标记。"},"pollock":{"note":"看层次：颜料有滴、有泼、有甩，有的浮在上层，有的被盖住。看走向：无数条线交叠，没有中心也没有上下。"},"warhol":{"note":"看重复：三十二个罐头排成一行，正好对应当时的汤品种类。看印刷：丝网印边角有轻微错位，不追求手绘感。"}},"eras":{"c_pre_qin":{"lead":"商周青铜礼器上的饕餮纹、战国帛画上的龙凤人物，是这一时期留下的主要图像。绘画还没独立成科，图样归礼制与巫祭管。后来的线描传统，要从青铜纹样和漆画上去找起点。"},"c_qin_han":{"lead":"兵马俑的陶塑、画像石上的车马出行、墓室壁画里的宴饮，都指向同一件事：图像在替死者延续生活。叙事压过抒情，场面铺得满，线条粗壮，颜色以朱、黑、白为主。"},"c_weijin":{"lead":"佛教东来，敦煌、云冈、龙门相继开窟。绘画从记事转向传神，顾恺之提出以形写神，人物开始讲究眼神和衣纹的节奏。山水这时还是人物背后的布景，比例尚未调匀。"},"c_tang":{"lead":"人物画到这里最盛：阎立本画帝王接见，吴道子在寺观画壁。青绿山水一路走熟，水墨也从王维这里起头。卷轴与壁画并行，长安和敦煌是两个现场。吴道子的壁画今无一存。"},"c_five":{"lead":"荆浩、关仝画北方的石山，董源、巨然画江南的土坡。两种地貌，两套皴法。此后一千年中国山水的南北分野，基本在这几十年里定型。五代虽短，画史上的分量不轻。"},"c_song":{"lead":"北宋院体讲格物，范宽的雨点皴、郭熙的卷云皴都在追可辨的山石质地。南宋李唐一系转向边角构图，留白变多。同时苏轼、米芾提出士人画的标准，与画院并行。"},"c_yuan":{"lead":"赵孟頫主张作画贵有古意，把书法用笔带进画里。黄公望、倪瓒一路把山水推向干笔淡墨，画上的题跋也越来越长。文人画从一种主张，变成了可操作的一整套做法。"},"c_ming":{"lead":"吴门四家把苏州的文人趣味做成主流，仇英一路保留工笔重彩。董其昌提出南北宗论，用禅宗谱系重排画史。徐渭的大写意是另一极，把墨与情绪一起泼在纸上。"},"c_qing":{"lead":"四僧在明亡之后画冷、画奇，石涛讲笔墨当随时代。扬州八怪把金石趣味带进写意花鸟，任伯年、吴昌硕在上海接上市场。宫廷里则是四王的正统一路，两套趣味并行。"},"c_modern":{"lead":"三条路同时走：徐悲鸿用西方素描改造中国画教学，齐白石从民间与金石里衰年变法，林风眠一路调和中西。美术学院制度建立，画家第一次成为一种职业身份。"},"w_antiquity":{"lead":"希腊瓶画从黑绘转红绘，人物从侧面剪影变成有透视缩短的形体。雕塑确立了后来西方一再回望的人体比例。但留存下来的绘画几乎只有瓶画和墓室壁画，材料很不对称。"},"w_medieval":{"lead":"拜占庭镶嵌画用金底和正面律，把人物从空间里抽出来放进永恒。罗马式厚重，哥特式把墙换成彩色玻璃窗。图像在这里承担的是教导信徒的功能，不是再现自然。"},"w_renaissance":{"lead":"透视实验、解剖研究与油画的透明罩染，在这一百多年里同时到位。意大利人算比例和空间，北方人磨质感和细节。艺术家的身份从工匠向创造者移动，签名第一次变得要紧。"},"w_baroque":{"lead":"明暗对照把舞台光打进画里，构图改用对角线而非水平线。天主教会用这种感染力做宣传，荷兰的新教市民则买小幅的风俗、静物和风景。同一种技术，两种用途。"},"w_rococo_classicism":{"lead":"洛可可画贵族的闲暇，颜色轻，题材是游园、秋千、梳妆。到1780年代风向倒转，大卫用罗马共和国的故事讲当下的政治，线条重新变硬，公民德性取代享乐。"},"w_romanticism":{"lead":"崇高取代优美：暴风雨、冰川、废墟、异国的后宫。德拉克洛瓦用色彩的动势对抗安格尔的线条，弗里德里希让人背对观众站在雾里。情感不再是需要被规范的东西，而是题材本身。"},"w_realism":{"lead":"库尔贝把家乡一场普通葬礼画成历史画的尺寸，米勒画弯腰拾穗的农妇。这类画在当时被斥为丑陋，因为尺寸本身就是态度：这些人也该被画成两米高。"},"w_impressionism":{"lead":"管装颜料与便携画架让人能在户外久待，铬黄、钴蓝这类新颜料也更亮。他们不叠透明色层，把纯色并置让眼睛去混。1874年首展被讥为印象派，名字来自莫奈一幅画的标题。"},"w_post_impressionism":{"lead":"四个人从印象派出发，走向四个方向：塞尚找结构，梵高用笔触承载情绪，高更用平涂做象征，修拉用色点做光学实验。现代艺术的几条主干道，在这里分岔。"},"w_modernism":{"lead":"摄影把记录的活接走了，绘画被迫回答自己还能做什么。立体主义拆解视点，抽象艺术取消物象，杜尚干脆取消画面。争论的对象从画得像不像，变成什么算艺术。"},"w_contemporary":{"lead":"重心移到纽约。抽象表现主义把画布当行动现场，波普把广告和罐头搬进美术馆，极少主义把作者的判断减到最少。作品的意义越来越多地由文字、场地和解读构成。"}}}};

    var s = String(y).replace(/[^\d\-]/g, '');
    return s || String(y);
  }
  function centuryOf(y) {
    if (!y && y !== 0) return null;
    var v = Math.floor((y - 1) / 100) + 1;
    return v;
  }
  function centuryLabel(c) {
    if (!c) return '';
    return c <= 0 ? '公元前 ' + Math.abs(c - 1) + ' 世纪起' : c + ' 世纪';
  }

  /* ---------- 图片：本地优先，失败回退 Commons ---------- */
  function paintFigure(holder, nodeId, opts) {
    opts = opts || {};
    var meta = IMG[nodeId];
    var ph = holder.querySelector('.ph') || holder;
    var skel = ph.querySelector('.skel');
    var img = ph.querySelector('img');
    if (!img) {
      img = el('img', { alt: opts.alt || '', loading: 'lazy', decoding: 'async' });
      ph.appendChild(img);
    }
    img.alt = opts.alt || '';
    if (!meta || (!meta.file && !meta.remote)) {
      if (skel) skel.textContent = '暂无可用图像';
      ph.classList.add('bad');
      return;
    }
    var tried = 0;
    function trySrc() {
      if (tried === 0) return meta.file || meta.remote;
      if (tried === 1) return meta.remote && meta.remote !== (meta.file) ? meta.remote : null;
      return null;
    }
    function load() {
      var src = trySrc();
      if (!src) {
        if (skel) skel.textContent = '图像暂时无法加载';
        ph.classList.add('bad');
        return;
      }
      img.onload = function () {
        img.classList.add('ok');
        if (skel) skel.style.display = 'none';
      };
      img.onerror = function () { tried++; load(); };
      img.src = src;
    }
    load();
    var cap = holder.querySelector('figcaption');
    if (cap && opts.caption !== false) {
      var n = byId[nodeId];
      var w = n && n.works && n.works[0];
      cap.innerHTML =
        '<span>' + esc((w ? w.title : '') + (n ? ' · ' + n.name : '')) + (w ? ' <span style="opacity:.7">' + esc(w.year || '') + '</span>' : '') + '</span>' +
        '<span class="cr">' + esc(meta && meta.credit ? meta.credit : 'Wikimedia Commons') +
        (meta && meta.license ? ' · ' + esc(meta.license) : '') + '</span>';
    }
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function cardHTML(n) {
    var w = n.works && n.works[0];
    var cp = COPY.works[n.id] || {};
    return '<div class="card" data-id="' + n.id + '">' +
      '<div class="ph"><div class="skel">' + esc(w ? w.title : '') + '</div></div>' +
      '<div class="meta">' +
      '<div class="y">' + esc(w ? w.year : '') + '</div>' +
      '<div class="t">' + esc(w ? w.title : n.name) + '</div>' +
      '<div class="a"><span class="dot ' + n.tradition + '"></span>' + esc(n.name) + ' · ' + esc(n.school || '') + '</div>' +
      (cp.note ? '<div class="no">' + esc(cp.note) + '</div>' : '') +
      '</div></div>';
  }

  /* ============ 视图路由 ============ */
  var VIEWS = ['graph', 'time', 'compare', 'read'];
  var state = { view: 'graph', tradition: 'all', per: null, essay: null, types: null, tlFilter: 'all' };

  function parseHash() {
    var h = (location.hash || '').replace(/^#/, '');
    var qs = new URLSearchParams(location.search || '');
    var t = qs.get('tradition');
    state.tradition = (t === 'china' || t === 'west') ? t : 'all';
    state.per = qs.get('per') || null;
    if (!h) return 'graph';
    var m = h.match(/^read\/(.+)$/);
    if (m) { state.essay = m[1]; return 'read'; }
    if (h.indexOf('read') === 0) { state.essay = null; return 'read'; }
    if (VIEWS.indexOf(h) >= 0) return h;
    return 'graph';
  }
  function go(view, extra) {
    extra = extra || {};
    var q = [];
    if (state.tradition !== 'all') q.push('tradition=' + state.tradition);
    if (extra.per) q.push('per=' + encodeURIComponent(extra.per));
    var hash = view === 'read' && state.essay ? '#read/' + state.essay : '#' + view;
    var url = location.pathname + (q.length ? '?' + q.join('&') : '') + hash;
    history.pushState(null, '', url);
    state.view = view;
    render();
  }
  window.addEventListener('popstate', function () { syncFromURL(true); });

  function syncFromURL(skipPush) {
    var v = parseHash();
    state.view = v;
    render();
  }

  function setTradition(t) {
    state.tradition = t;
    var badge = $('#tradBadge');
    badge.textContent = t === 'china' ? '中国' : t === 'west' ? '西方' : '全部';
    badge.className = 'trad ' + (t === 'all' ? '' : t);
    var url = new URL(location.href);
    if (t === 'all') url.searchParams.delete('tradition'); else url.searchParams.set('tradition', t);
    url.searchParams.delete('per');
    history.replaceState(null, '', url.toString());
    if (state.view === 'graph') { layout(true); drawGraph(); }
    renderTime(); renderCompare();
  }

  function render() {
    VIEWS.forEach(function (v) {
      $('#v-' + v).classList.toggle('on', v === state.view);
    });
    $$('#views button').forEach(function (b) {
      b.setAttribute('aria-current', b.dataset.v === state.view ? 'true' : 'false');
    });
    if (state.view === 'graph') { ensureGraph(); }
    if (state.view === 'time') renderTime();
    if (state.view === 'compare') renderCompare();
    if (state.view === 'read') renderRead();
  }

  /* ============ 关系图 ============ */
  var svg = $('#graph'), stage = $('#stage');
  var vp = null, gAxis = null, gEdge = null, gNode = null;
  var W = 0, H = 0;
  var view = { k: 1, x: 0, y: 0 };
  var sim = { alpha: 0, timer: null };
  var axisMode = true;
  var hoverId = null, selId = null;
  var typeFilter = null;

  function sizeOf(n) { return 5 + Math.min(8, (deg[n.id] || 0) * 0.9); }

  function ensureGraph() {
    if (vp) { resize(); return; }
    vp = svgEl('g'); gAxis = svgEl('g', { 'class': 'axis' }); gEdge = svgEl('g'); gNode = svgEl('g');
    vp.appendChild(gAxis); vp.appendChild(gEdge); vp.appendChild(gNode);
    svg.appendChild(vp);
    resize();
    layout(true);
    bindGraph();
    runSim();
  }
  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(320, r.width); H = Math.max(320, r.height);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
  }

  function visibleNodes() {
    return NODES.filter(function (n) { return state.tradition === 'all' || n.tradition === state.tradition; });
  }
  function visibleEdges() {
    var set = {};
    visibleNodes().forEach(function (n) { set[n.id] = 1; });
    return EDGES.filter(function (e) {
      return byId[e.source] && byId[e.target] && set[e.source] && set[e.target] &&
        (!typeFilter || e.type === typeFilter);
    });
  }

  function layout(reset) {
    var ns = visibleNodes();
    var yrs = NODES.map(function (n) { return n.year; });
    var yMin = Math.min.apply(null, yrs), yMax = Math.max.apply(null, yrs);
    var padX = 70, padY = 60;
    ns.forEach(function (n, i) {
      if (reset || n.x === undefined) {
        n.x = padX + ((n.year - yMin) / (yMax - yMin)) * (W - padX * 2) + (Math.random() - 0.5) * 20;
        n.y = (n.tradition === 'china' ? 0.35 : 0.66) * H + (Math.random() - 0.5) * H * 0.34;
        n.vx = 0; n.vy = 0;
      }
      n.tx = padX + ((n.year - yMin) / (yMax - yMin)) * (W - padX * 2);
      n.ty = (n.tradition === 'china' ? 0.33 : 0.68) * H;
    });
    drawAxis(yMin, yMax, padX);
  }

  function drawAxis(yMin, yMax, padX) {
    gAxis.innerHTML = '';
    var ticks = [];
    for (var y = 400; y <= 2000; y += 200) if (y >= yMin - 100 && y <= yMax + 100) ticks.push(y);
    var X = function (yr) { return padX + ((yr - yMin) / (yMax - yMin)) * (W - padX * 2); };
    ticks.forEach(function (t) {
      var x = X(t);
      gAxis.appendChild(svgEl('line', { x1: x, y1: 34, x2: x, y2: H - 10, 'stroke-dasharray': '2 6' }));
      var tx = svgEl('text', { x: x, y: 24, 'text-anchor': 'middle' });
      tx.textContent = t;
      gAxis.appendChild(tx);
    });
  }

  function step() {
    var ns = visibleNodes(), es = visibleEdges();
    var i, j, a, b, dx, dy, d2, d, f;
    for (i = 0; i < ns.length; i++) {
      a = ns[i];
      for (j = i + 1; j < ns.length; j++) {
        b = ns[j];
        dx = b.x - a.x; dy = b.y - a.y;
        d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
        d = Math.sqrt(d2);
        var minD = sizeOf(a) + sizeOf(b) + 26;
        f = Math.min(2600 / d2, 6);
        if (d < minD) f += (minD - d) * 0.28;
        var ux = dx / d, uy = dy / d;
        a.vx -= ux * f; a.vy -= uy * f;
        b.vx += ux * f; b.vy += uy * f;
      }
    }
    es.forEach(function (e) {
      a = byId[e.source]; b = byId[e.target];
      if (!a || !b) return;
      dx = b.x - a.x; dy = b.y - a.y;
      d = Math.sqrt(dx * dx + dy * dy) || 1;
      var rest = e.type === 'lineage' ? 90 : e.type === 'milieu' ? 130 : 115;
      f = (d - rest) * 0.014;
      var ux = dx / d, uy = dy / d;
      a.vx += ux * f; a.vy += uy * f;
      b.vx -= ux * f; b.vy -= uy * f;
    });
    var kx = axisMode ? 0.055 : 0.004;
    var ky = axisMode ? 0.006 : 0.004;
    ns.forEach(function (n) {
      n.vx += (n.tx - n.x) * kx;
      n.vy += (n.ty - n.y) * ky;
      n.vx *= 0.82; n.vy *= 0.82;
      n.x += n.vx; n.y += n.vy;
      var m = 26 + sizeOf(n);
      n.x = Math.max(m, Math.min(W - m, n.x));
      n.y = Math.max(48, Math.min(H - 28, n.y));
    });
  }

  function runSim() {
    sim.alpha = 1;
    if (sim.timer) return;
    var n = 0;
    sim.timer = setInterval(function () {
      for (var i = 0; i < 2; i++) step();
      drawGraph();
      if (++n > 260) { clearInterval(sim.timer); sim.timer = null; }
    }, 16);
  }

  var nodeEls = {}, edgeEls = {};

  function drawGraph() {
    if (!vp) return;
    var es = visibleEdges();
    var focus = selId || hoverId;
    var neigh = {};
    if (focus) {
      neigh[focus] = 1;
      es.forEach(function (e) {
        if (e.source === focus) neigh[e.target] = 1;
        if (e.target === focus) neigh[e.source] = 1;
      });
    }
    /* 边：复用 DOM，避免整块重建打断指针事件 */
    var seenE = {};
    es.forEach(function (e) {
      var s = byId[e.source], t = byId[e.target];
      if (!s || !t) return;
      var key = e.source + '>' + e.target + '>' + e.type;
      seenE[key] = 1;
      var l = edgeEls[key];
      if (!l) {
        l = svgEl('line', { 'class': 'edge t-' + e.type });
        gEdge.appendChild(l);
        edgeEls[key] = l;
      }
      l.setAttribute('x1', s.x); l.setAttribute('y1', s.y);
      l.setAttribute('x2', t.x); l.setAttribute('y2', t.y);
      var lit = focus && (e.source === focus || e.target === focus);
      l.setAttribute('class', 'edge t-' + e.type + (focus ? (lit ? ' hi' : ' dim') : ''));
    });
    Object.keys(edgeEls).forEach(function (k) {
      if (!seenE[k]) { edgeEls[k].remove(); delete edgeEls[k]; }
    });
    /* 节点：同样复用 */
    var ns = visibleNodes();
    var shown = {};
    ns.forEach(function (n) {
      shown[n.id] = 1;
      var r = sizeOf(n);
      var isFocus = focus === n.id;
      var o = nodeEls[n.id];
      if (!o) {
        var g = svgEl('g', { 'class': 'node', 'data-id': n.id });
        var hit = svgEl('circle', { r: 14, fill: 'transparent', 'pointer-events': 'all' });
        var c = svgEl('circle', { r: 5, 'pointer-events': 'none' });
        var tx = svgEl('text', { 'text-anchor': 'middle', 'pointer-events': 'none' });
        tx.textContent = n.name;
        g.appendChild(hit); g.appendChild(c); g.appendChild(tx);
        gNode.appendChild(g);
        nodeEls[n.id] = { g: g, c: c, t: tx, hit: hit };
        o = nodeEls[n.id];
      }
      o.hit.setAttribute('cx', n.x); o.hit.setAttribute('cy', n.y);
      o.c.setAttribute('cx', n.x); o.c.setAttribute('cy', n.y);
      o.c.setAttribute('r', isFocus ? r + 3 : r);
      o.c.setAttribute('fill', n.tradition === 'china' ? 'var(--china)' : 'var(--west)');
      o.c.setAttribute('stroke', isFocus ? 'var(--ink)' : 'var(--paper)');
      o.c.setAttribute('stroke-width', isFocus ? 2 : 1.4);
      o.t.setAttribute('x', n.x); o.t.setAttribute('y', n.y + r + 13);
      var showLabel = !focus || neigh[n.id] || view.k > 1.15;
      o.t.setAttribute('opacity', showLabel ? 1 : 0);
      o.g.setAttribute('class', 'node' + (focus && !neigh[n.id] ? ' dim' : ''));
    });
    Object.keys(nodeEls).forEach(function (k) {
      if (!shown[k]) { nodeEls[k].g.remove(); delete nodeEls[k]; }
    });
    vp.setAttribute('transform', 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')');
  }

  function bindGraph() {
    var dragging = null, panning = null, moved = false;
    svg.addEventListener('pointerdown', function (ev) {
      var t = ev.target.closest ? ev.target.closest('.node') : null;
      moved = false;
      if (t) {
        dragging = byId[t.dataset.id];
        svg.classList.add('grabbing');
      } else {
        panning = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y };
        svg.classList.add('grabbing');
      }
      svg.setPointerCapture && svg.setPointerCapture(ev.pointerId);
    });
    svg.addEventListener('pointermove', function (ev) {
      var r = svg.getBoundingClientRect();
      var mx = (ev.clientX - r.left - view.x) / view.k;
      var my = (ev.clientY - r.top - view.y) / view.k;
      if (dragging) {
        moved = true;
        dragging.x = mx; dragging.y = my; dragging.vx = 0; dragging.vy = 0;
        if (!sim.timer) runSim();
        drawGraph();
      } else if (panning) {
        moved = true;
        view.x = panning.vx + (ev.clientX - panning.x);
        view.y = panning.vy + (ev.clientY - panning.y);
        drawGraph();
      } else {
        var hit = null, best = 1e9;
        visibleNodes().forEach(function (n) {
          var d = (n.x - mx) * (n.x - mx) + (n.y - my) * (n.y - my);
          if (d < best && d < (sizeOf(n) + 8) * (sizeOf(n) + 8)) { best = d; hit = n; }
        });
        var id = hit ? hit.id : null;
        if (id !== hoverId) { hoverId = id; drawGraph(); }
        svg.style.cursor = id ? 'pointer' : '';
      }
    });
    svg.addEventListener('pointerup', function (ev) {
      var wasDrag = moved;
      if (dragging && !wasDrag) { openNode(dragging.id); }
      dragging = null; panning = null;
      svg.classList.remove('grabbing');
      if (wasDrag) runSim();
    });
    svg.addEventListener('pointerleave', function () { if (hoverId) { hoverId = null; drawGraph(); } });
    svg.addEventListener('wheel', function (ev) {
      ev.preventDefault();
      var r = svg.getBoundingClientRect();
      var mx = ev.clientX - r.left, my = ev.clientY - r.top;
      var k2 = Math.max(0.45, Math.min(3.2, view.k * (ev.deltaY < 0 ? 1.12 : 0.89)));
      view.x = mx - (mx - view.x) * (k2 / view.k);
      view.y = my - (my - view.y) * (k2 / view.k);
      view.k = k2;
      drawGraph();
    }, { passive: false });
    window.addEventListener('resize', function () {
      if (state.view !== 'graph') return;
      resize(); layout(false); runSim();
    });
    $('#zin').onclick = function () { zoomBy(1.2); };
    $('#zout').onclick = function () { zoomBy(1 / 1.2); };
    $('#zfit').onclick = function () { view = { k: 1, x: 0, y: 0 }; layout(true); runSim(); };
  }
  function zoomBy(f) {
    var k2 = Math.max(0.45, Math.min(3.2, view.k * f));
    var cx = W / 2, cy = H / 2;
    view.x = cx - (cx - view.x) * (k2 / view.k);
    view.y = cy - (cy - view.y) * (k2 / view.k);
    view.k = k2;
    drawGraph();
  }

  /* 关系图控制条 */
  var bar = $('#v-graph .bar');
  var axisBtn = document.createElement('button');
  axisBtn.className = 'chip on';
  axisBtn.textContent = '年代轴';
  axisBtn.style.marginLeft = '2px';
  axisBtn.onclick = function () {
    axisMode = !axisMode;
    axisBtn.classList.toggle('on', axisMode);
    axisBtn.textContent = axisMode ? '年代轴' : '自由布局';
    layout(false); runSim();
  };
  bar.insertBefore(axisBtn, bar.querySelector('.sep'));

  $$('#v-graph .chip[data-f]').forEach(function (b) {
    b.onclick = function () { setTradition(b.dataset.f); };
  });
  $$('#v-graph .chip[data-t]').forEach(function (b) {
    b.onclick = function () {
      var t = b.dataset.t;
      typeFilter = (typeFilter === t) ? null : t;
      $$('#v-graph .chip[data-t]').forEach(function (x) { x.classList.toggle('on', x.dataset.t === typeFilter); });
      runSim();
    };
  });

  /* ============ 详情抽屉 ============ */
  var drawer = $('#drawer');
  function openNode(id) {
    var n = byId[id];
    if (!n) return;
    selId = id;
    drawGraph();
    var cp = COPY.nodes[id] || {};
    var wc = COPY.works[id] || {};
    var w = n.works && n.works[0];
    var era = eraById[n.era];
    $('#d-name').textContent = n.name;
    $('#d-sub').innerHTML = esc(n.nameEn || '') + ' · ' + esc(n.born || '?') + '–' + esc(n.died || '?') +
      (n.uncertain ? ' · 生卒年/归属存疑' : '');
    var rels = EDGES.filter(function (e) { return e.source === id || e.target === id; });
    var html = '';
    html += '<span class="tag ' + n.tradition + '">' + (n.tradition === 'china' ? '中国' : '西方') + ' · ' + esc(n.school || '') + '</span>';
    if (n.region) html += '<div class="sub" style="font-size:12px;color:var(--ink-2);margin:-4px 0 12px">' + esc(n.region) + (era ? ' · ' + esc(era.name) : '') + '</div>';
    if (cp.tagline) html += '<p style="font-size:17px;color:var(--ink)">' + esc(cp.tagline) + '</p>';
    if (cp.bio) html += '<p>' + esc(cp.bio) + '</p>';
    if (w) {
      html += '<div class="fig"><div class="ph"><div class="skel">' + esc(w.title) + '</div></div><figcaption></figcaption></div>';
    }
    if (wc.note) html += '<p>' + esc(wc.note) + '</p>';
    if (rels.length) {
      html += '<div class="rel"><h4>关系 · ' + rels.length + ' 条</h4>';
      rels.forEach(function (e) {
        var other = e.source === id ? e.target : e.source;
        var o = byId[other];
        if (!o) return;
        var dir = e.source === id ? '→' : '←';
        html += '<div class="e"><span class="k">' + TYPE_LABEL[e.type] + '</span>' +
          '<span class="who" data-go="' + other + '">' + dir + ' ' + esc(o.name) + '</span>' +
          '<span class="lbl">' + esc(e.label || '') + '</span></div>';
